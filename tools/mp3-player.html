<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="htmlboard-icon" content="🎧">
<meta name="color-scheme" content="dark">
<title>MP3 Player</title>
<style>
:root{
  --bg:#0b0b0d;--body1:#2b2c31;--body2:#151619;--wheel1:#303137;--wheel2:#1a1b1f;--center1:#3b3c43;--center2:#232429;
  --label:#b7bec7;--labelOn:#ffffff;
  --screen:#0f1317;--fg:#e9eef4;--dim:#8b97a4;--bar1:#232a31;--bar2:#161b20;--hi1:#3b8eff;--hi2:#1d5fd2;--hifg:#ffffff;
  --prog:#26303a;--art1:#2a3440;--art2:#151a20;--artfg:#4c5a68;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--body2);color:var(--fg);
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,sans-serif;
  -webkit-user-select:none;user-select:none;overflow:hidden;overscroll-behavior:none;-webkit-touch-callout:none}
body{padding:0}
/* The body fills the whole phone screen. Safe-area padding keeps content clear of the notch, home bar and left-edge swipe. */
.deck{--wsz:min(68vw,33svh,330px);position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;gap:14px;
  /* clear the phone's rounded screen corners even when the host reports no safe area */
  padding:max(calc(env(safe-area-inset-top) + 14px),52px) calc(env(safe-area-inset-right) + 20px)
          max(calc(env(safe-area-inset-bottom) + 12px),30px) calc(env(safe-area-inset-left) + 20px);
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.022) 0 1px,transparent 1px 3px),
             linear-gradient(170deg,var(--body1),var(--body2))}
/* ----- the screen window: a recessed bezel with screws ----- */
.window{position:relative;width:100%;max-width:560px;flex:1 1 auto;min-height:230px;max-height:520px;display:flex}
.screw{position:absolute;width:9px;height:9px;border-radius:50%;
  background:radial-gradient(circle at 40% 35%,#9aa0a7,#4a4e54 70%);box-shadow:0 1px 1px rgba(0,0,0,.6)}
.screw::after{content:"";position:absolute;left:1px;right:1px;top:4px;height:1px;background:rgba(0,0,0,.55);transform:rotate(35deg)}
.screw.a{left:3px;top:3px}.screw.b{right:3px;top:3px}.screw.c{left:3px;bottom:3px}.screw.d{right:3px;bottom:3px}
.screen{width:100%;flex:1 1 auto;min-height:0;background:var(--screen);color:var(--fg);
  border:2px solid #000;border-radius:12px;box-shadow:0 6px 18px rgba(0,0,0,.35);
  display:flex;flex-direction:column;overflow:hidden;position:relative;container-type:inline-size;isolation:isolate;
  /* WebKit: rounded corners don't clip layered children (album art, shadows) without a mask */
  -webkit-mask-image:-webkit-radial-gradient(white,black);mask-image:radial-gradient(white,black)}
.screen::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:30;
  background:linear-gradient(155deg,rgba(255,255,255,.07),transparent 38%)}
/* ----- printed label strip ----- */
.strip{display:flex;align-items:center;gap:10px;width:100%;max-width:560px;flex:0 0 auto;
  font:700 10px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.24em;color:var(--label);opacity:.85}
.strip .rule{flex:1;height:1px;background:var(--label);opacity:.3}
.led{width:7px;height:7px;border-radius:50%;background:#3b1410;box-shadow:inset 0 1px 1px rgba(0,0,0,.6);transition:background .2s,box-shadow .2s}
.led.on{background:#ff5a33;box-shadow:0 0 6px #ff5a33,0 0 12px rgba(255,90,51,.6)}
.bar{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:clamp(3px,2cqw,7px) 10px;font-size:clamp(11px,4.2cqw,14px);font-weight:600;
  background:linear-gradient(var(--bar1),var(--bar2));border-bottom:1px solid rgba(0,0,0,.35)}
.bar .t{flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .ind{min-width:22px;font-size:11px;color:var(--hi1);white-space:nowrap}
.bar svg{display:block}
.body{flex:1;position:relative;overflow:hidden}
.list{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.row{display:flex;align-items:center;gap:8px;padding:6px 12px;min-height:clamp(28px,13cqw,46px);border-bottom:1px solid rgba(127,127,127,.12);cursor:pointer}
.row .txt{flex:1;min-width:0}
.row .l{font-size:clamp(12px,5.2cqw,17px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:clamp(9px,3.6cqw,12px);color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.row .r{color:var(--dim);font-size:15px;flex:0 0 auto}
.row.sel{background:linear-gradient(var(--hi1),var(--hi2));color:var(--hifg)}
.row.sel .s,.row.sel .r{color:var(--hifg);opacity:.85}
.info{position:absolute;inset:0;overflow-y:auto;padding:12px 14px;font-size:15px;line-height:1.45;-webkit-user-select:text;user-select:text}
.info p{margin:0 0 10px}.info ol{margin:0 0 10px;padding-left:20px}
.np{position:absolute;inset:0;display:flex;flex-direction:column;padding:12px;gap:10px}
.np-top{flex:1;display:flex;gap:12px;align-items:center;min-height:0}
.art{flex:0 0 auto;width:42%;max-width:170px;aspect-ratio:1;border-radius:6px;background:linear-gradient(135deg,var(--art1),var(--art2));
  display:flex;align-items:center;justify-content:center;font-size:42px;color:var(--artfg);overflow:hidden;box-shadow:0 4px 14px rgba(0,0,0,.5)}
.art img{width:100%;height:100%;object-fit:cover;display:block}
.np-meta{flex:1;min-width:0}
.np-c{font-size:12px;color:var(--dim);margin-bottom:6px}
.np-t{font-size:clamp(13px,5.4cqw,18px);font-weight:700;line-height:1.2;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.np-a,.np-al{font-size:14px;color:var(--dim);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np-f{font-size:12px;color:var(--hi1);margin-top:8px;min-height:15px}
.prog{height:8px;border-radius:4px;background:var(--prog);overflow:hidden}
.fill{height:100%;width:0;background:linear-gradient(90deg,var(--hi2),var(--hi1))}
.times{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
.empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:15px;text-align:center;padding:20px}
.toast{position:absolute;left:10px;right:10px;bottom:10px;padding:9px 12px;border-radius:10px;background:rgba(20,26,32,.95);
  border:1px solid rgba(255,255,255,.1);font-size:14px;text-align:center;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none;z-index:25}
.toast.on{opacity:1;transform:none}
.deck,.screen,.bar,.center{transition:background .25s,color .25s}
input[type=file]{display:none}
.offscr{position:absolute;inset:0;background:#000;z-index:40;display:none}
.deck.asleep .offscr{display:block}
.body{border-radius:0 0 4px 4px}
/* ----- control deck: four hardware keys and a rotary jog dial ----- */
.controls{width:100%;max-width:560px;flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:16px}
.btnrow{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:100%}
.btnrow button{min-height:52px;border:0;border-radius:9px;padding:6px 4px;
  background:linear-gradient(180deg,var(--center1),var(--center2));
  box-shadow:0 4px 0 rgba(0,0,0,.55),0 5px 8px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.14);
  color:var(--label);font:700 10px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.16em;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;touch-action:none;cursor:pointer;
  transition:transform .06s,box-shadow .06s,color .1s}
.btnrow button svg{width:20px;height:20px}
.btnrow button:active,.btnrow button.flash{transform:translateY(3px);
  box-shadow:0 1px 0 rgba(0,0,0,.55),0 2px 4px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.1)}
.btnrow button.flash{color:var(--labelOn)}
.knobwrap{position:relative;flex:0 0 auto;width:calc(var(--wsz) + 26px);height:calc(var(--wsz) + 26px);border-radius:50%;
  display:flex;align-items:center;justify-content:center}
.knobwrap::before{content:"";position:absolute;inset:0;border-radius:50%;opacity:.55;
  background:repeating-conic-gradient(from -1deg,var(--label) 0 2deg,transparent 2deg 18deg);
  -webkit-mask:radial-gradient(circle,transparent 0 86%,#000 87% 100%);mask:radial-gradient(circle,transparent 0 86%,#000 87% 100%)}
.wheel{position:relative;width:var(--wsz);height:var(--wsz);border-radius:50%;touch-action:none;cursor:grab;
  box-shadow:0 10px 18px rgba(0,0,0,.55),0 0 0 2px rgba(0,0,0,.55)}
.grip{position:absolute;inset:0;border-radius:50%;pointer-events:none;
  background:repeating-conic-gradient(var(--wheel1) 0 3deg,var(--wheel2) 3deg 6deg)}
.grip::before{content:"";position:absolute;inset:8%;border-radius:50%;
  background:radial-gradient(circle at 50% 30%,var(--wheel1),var(--wheel2) 80%);
  box-shadow:0 0 0 1px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.12)}
.grip::after{content:"";position:absolute;left:50%;top:11%;width:6px;height:6px;margin-left:-3px;border-radius:50%;
  background:var(--labelOn);box-shadow:0 0 4px rgba(255,255,255,.5)}
.center{position:absolute;left:32%;top:32%;width:36%;height:36%;border-radius:50%;border:0;padding:0;
  background:radial-gradient(circle at 50% 30%,var(--center1),var(--center2));
  box-shadow:0 0 0 1px rgba(0,0,0,.5),inset 0 2px 3px rgba(0,0,0,.35),inset 0 -1px 0 rgba(255,255,255,.08);
  color:var(--label);font:700 12px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.18em;cursor:pointer}
.center:active{filter:brightness(1.35)}
.flow{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden}
.stage{flex:1;position:relative;perspective:600px;overflow:hidden}
.cover{position:absolute;left:50%;border-radius:4px;overflow:hidden;background:linear-gradient(135deg,var(--art1),var(--art2));
  color:var(--artfg);display:flex;align-items:center;justify-content:center;font-size:40px;cursor:pointer;
  transition:transform .28s ease;-webkit-box-reflect:below 2px linear-gradient(transparent 62%,rgba(255,255,255,.22))}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.flow-cap{flex:0 0 auto;text-align:center;padding:4px 10px 10px}
.flow-cap .t{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.flow-cap .a{font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
</style>
</head>
<body>
<div class="deck">
  <div class="window">
    <div class="screen">
      <div class="bar">
        <span class="ind" id="ind"></span>
        <span class="t" id="title">MP3 Player</span>
        <svg width="24" height="12" viewBox="0 0 24 12" aria-hidden="true"><rect x=".5" y=".5" width="20" height="11" rx="2" fill="none" stroke="#8b97a4"/><rect x="2" y="2" width="15" height="8" rx="1" fill="#5fd068"/><rect x="21.5" y="4" width="2" height="4" rx="1" fill="#8b97a4"/></svg>
      </div>
      <div class="body" id="body"></div>
      <div class="toast" id="toast"></div>
      <div class="offscr" id="offscr"></div>
    </div>
  </div>
  <div class="strip"><span class="led" id="led"></span><span id="brand">MP3 PLAYER</span><span class="rule"></span><span>STEREO · HI-FI</span></div>
  <div class="controls">
    <div class="btnrow" id="btnrow">
      <button data-z="menu" aria-label="Back"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M10 5 3 12l7 7v-4.5h5a4 4 0 0 1 0 8h-1v2h1a6 6 0 0 0 0-12h-5z" transform="translate(0 -3)"/></svg>BACK</button>
      <button data-z="prev" aria-label="Previous"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M21 6l-7 6 7 6zM13 6l-7 6 7 6zM3 6h2v12H3z"/></svg>PREV</button>
      <button data-z="play" aria-label="Play or pause"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M2 6l8 6-8 6zM13 6h3v12h-3zM18.5 6h3v12h-3z"/></svg>PLAY</button>
      <button data-z="next" aria-label="Next"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M3 6l7 6-7 6zM11 6l7 6-7 6zM19 6h2v12h-2z"/></svg>NEXT</button>
    </div>
    <div class="knobwrap">
      <div class="wheel" id="wheel" aria-label="Jog dial">
        <div class="grip" id="grip"></div>
        <button class="center" id="center" aria-label="Select">OK</button>
      </div>
    </div>
  </div>
</div>
<input type="file" id="pickAudio" accept="audio/*,.mp3,.m4a,.aac,.wav" multiple>
<input type="file" id="pickFolder" webkitdirectory multiple>
<input type="file" id="pickBook" accept=".m4b,.m4a,.mp3,.aac,audio/*" multiple>
<input type="file" id="pickBackup">
<input type="file" id="pickReconnect" accept="audio/*,.mp3,.m4a,.m4b,.aac,.wav" multiple>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const APP_NAME = 'MP3 Player';
const LS = 'mp3-player:settings';

/* ---------- settings (localStorage) ---------- */
const settings = Object.assign({shuffle:false, repeat:'off', clicker:true, haptics:true, body:'black', screen:'dark', last:null,
  otg:[], eq:'off', bookSpeed:1, bookPos:{}, brickHigh:0, spInApp:true, name:APP_NAME, gen:'big', wheel:'auto'},
  (() => { try { return JSON.parse(localStorage.getItem(LS) || '{}'); } catch (e) { return {}; } })());
function saveSettings(){ try { localStorage.setItem(LS, JSON.stringify(settings)); } catch (e) {} }

/* ---------- IndexedDB (songs + audio + playlists) ---------- */
let db;
function openDB(){
  return new Promise((res, rej) => {
    const r = indexedDB.open('mp3-player', 1);
    r.onupgradeneeded = () => {
      const d = r.result;
      d.createObjectStore('meta', {keyPath:'id'});
      d.createObjectStore('audio');
      d.createObjectStore('playlists', {keyPath:'id'});
    };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
function tx(store, mode, fn){
  return new Promise((res, rej) => {
    const t = db.transaction(store, mode);
    let out; const r = fn(t.objectStore(store));
    if (r) r.onsuccess = () => { out = r.result; };
    t.oncomplete = () => res(out);
    t.onerror = () => rej(t.error);
    t.onabort = () => rej(t.error);
  });
}
const dbAll = st => tx(st, 'readonly', s => s.getAll());
const dbGet = (st, k) => tx(st, 'readonly', s => s.get(k));
const dbPut = (st, v, k) => tx(st, 'readwrite', s => k === undefined ? s.put(v) : s.put(v, k));
const dbDel = (st, k) => tx(st, 'readwrite', s => s.delete(k));
const dbClear = st => tx(st, 'readwrite', s => s.clear());
const dbKeys = st => tx(st, 'readonly', s => s.getAllKeys());

let songs = [];      // metadata only
let playlists = [];  // saved Quick List playlists

/* No streaming service in this version: playback is always local. */
const remote = false, spNow = null;
const spRelease = () => {}, spControl = () => {}, spSeek = () => {}, spShuffle = () => {}, spScheduleSeek = () => {};
const spPos = () => 0;
const byName = (a, b) => a.name.localeCompare(b.name, undefined, {sensitivity:'base'});

/* ---------- toast ---------- */
let toastT;
function toast(msg, ms = 1800){
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), ms);
}

/* ---------- colors ---------- */
const LIGHT_WHEEL = {wheel1:'#fbfbfc', wheel2:'#d5d8dc', center1:'#eceef1', center2:'#d3d6db', label:'#7d838b', labelOn:'#2a2e33'};
const BODIES = {
  black:  {name:'Graphite', body1:'#2b2c31', body2:'#151619', wheel1:'#45474e', wheel2:'#1a1b1f', center1:'#3b3c43', center2:'#232429', label:'#b7bec7', labelOn:'#ffffff'},
  white:  Object.assign({name:'White',  body1:'#fbfbfa', body2:'#dcdddb'}, LIGHT_WHEEL),
  silver: Object.assign({name:'Silver', body1:'#eef0f2', body2:'#bfc4ca'}, LIGHT_WHEEL),
  red:    Object.assign({name:'Red',    body1:'#d8293d', body2:'#8c1020'}, LIGHT_WHEEL),
  blue:   Object.assign({name:'Blue',   body1:'#3d82e0', body2:'#18479e'}, LIGHT_WHEEL),
  green:  Object.assign({name:'Green',  body1:'#62c552', body2:'#2b8327'}, LIGHT_WHEEL),
  orange: Object.assign({name:'Orange', body1:'#f28a2e', body2:'#b7520f'}, LIGHT_WHEEL),
  pink:   Object.assign({name:'Pink',   body1:'#ee77b0', body2:'#b43a76'}, LIGHT_WHEEL),
  purple: Object.assign({name:'Purple', body1:'#9065d6', body2:'#55309c'}, LIGHT_WHEEL),
  gold:   Object.assign({name:'Gold',   body1:'#ead0a0', body2:'#b38c4f'}, LIGHT_WHEEL)
};
const SCREENS = {
  dark:    {name:'Dark',          screen:'#0f1317', fg:'#e9eef4', dim:'#8b97a4', bar1:'#232a31', bar2:'#161b20', hi1:'#3b8eff', hi2:'#1d5fd2', hifg:'#ffffff', prog:'#26303a', art1:'#2a3440', art2:'#151a20', artfg:'#4c5a68'},
  classic: {name:'Light',         screen:'#eef1f4', fg:'#15191d', dim:'#5d6874', bar1:'#fbfcfd', bar2:'#d6dce2', hi1:'#5ea4f2', hi2:'#2b6fd1', hifg:'#ffffff', prog:'#cbd3db', art1:'#d9dfe5', art2:'#b9c2cb', artfg:'#8a96a2'},
  lcd:     {name:'Grayscale LCD', screen:'#c6ccb4', fg:'#1f2419', dim:'#566049', bar1:'#c6ccb4', bar2:'#b9c0a6', hi1:'#1f2419', hi2:'#1f2419', hifg:'#c6ccb4', prog:'#a7af97', art1:'#b3baa1', art2:'#a3aa91', artfg:'#566049'},
  backlit: {name:'Blue Backlight', screen:'#a9cfe7', fg:'#0c2131', dim:'#2e4f66', bar1:'#c2e0f1', bar2:'#93c0dd', hi1:'#14334a', hi2:'#0c2131', hifg:'#bfe1f3', prog:'#82b4d4', art1:'#8fbfdd', art2:'#6fa6c9', artfg:'#2e4f66'},
  amber:   {name:'Amber',         screen:'#170f04', fg:'#ffb547', dim:'#b07a2a', bar1:'#2a1d0a', bar2:'#1d1406', hi1:'#ffb547', hi2:'#e0952a', hifg:'#170f04', prog:'#3a2a10', art1:'#2a1d0a', art2:'#170f04', artfg:'#b07a2a'},
  green:   {name:'Green Terminal', screen:'#08120a', fg:'#7dff8c', dim:'#3fa34c', bar1:'#11251a', bar2:'#0a170e', hi1:'#7dff8c', hi2:'#4cd65d', hifg:'#08120a', prog:'#183a20', art1:'#11251a', art2:'#08120a', artfg:'#3fa34c'}
};
const DARK_WHEEL = {wheel1:'#45474e', wheel2:'#1a1b1f', center1:'#3b3c43', center2:'#232429', label:'#b7bec7', labelOn:'#ffffff'};
const WHEELS = {
  auto:   {name:'Automatic'},
  white:  Object.assign({name:'White'}, LIGHT_WHEEL),
  black:  Object.assign({name:'Black'}, DARK_WHEEL),
  gray:   {name:'Gray',   wheel1:'#b3b7bc', wheel2:'#73777d', center1:'#9b9fa4', center2:'#7b7f85', label:'#f2f3f5', labelOn:'#ffffff'},
  silver: {name:'Brushed Metal', wheel1:'#f1f3f5', wheel2:'#9ea3a9', center1:'#e0e3e7', center2:'#bec2c7', label:'#5d636b', labelOn:'#22262b'},
  body:   {name:'Same as Body'}
};
const isLight = hex => { const n = parseInt(String(hex).slice(1), 16); return ((n >> 16 & 255) * 299 + (n >> 8 & 255) * 587 + (n & 255) * 114) / 1000 > 165; };
function wheelColors(b){
  const w = settings.wheel || 'auto';
  if (w === 'body') {
    const light = isLight(b.body1);
    return {wheel1:b.body1, wheel2:b.body2, center1:b.body1, center2:b.body2,
      label: light ? '#6d737b' : 'rgba(255,255,255,.78)', labelOn: light ? '#2d3136' : '#ffffff'};
  }
  return WHEELS[w] && WHEELS[w].wheel1 ? WHEELS[w] : b;
}
function applyTheme(){
  const b = BODIES[settings.body] || BODIES.black, sc = SCREENS[settings.screen] || SCREENS.dark, wc = wheelColors(b);
  const st = document.documentElement.style;
  ['body1','body2'].forEach(k => st.setProperty('--' + k, b[k]));
  ['wheel1','wheel2','center1','center2','label','labelOn'].forEach(k => st.setProperty('--' + k, wc[k]));
  ['screen','fg','dim','bar1','bar2','hi1','hi2','hifg','prog','art1','art2','artfg'].forEach(k => st.setProperty('--' + k, sc[k]));
}
applyTheme();

/* One layout: the four keys hold the buttons and the dial only scrolls (layout 'row'); the dial's knurl turns with your finger (scroll). */
const GENS = {big: {name:'Standard', layout:'row', scroll:true, color:true}};
const curGen = () => GENS.big;
function applyGen(){
  /* nothing to switch: the deck layout is fixed. (Adding a 'row' class here would pick up the list-row padding.) */

audio.addEventListener('timeupdate', () => {
  updateNow(true);

  if (n - lastSave > 5000) {
    lastSave = n; saveLast();

  }
  if (current && loadedId === current.id && !isBook(current) && countedId !== current.id &&
      audio.currentTime >= Math.min(30, (isFinite(audio.duration) ? audio.duration : 60) * 0.5)) {

/* ---------- sleep timer ---------- */
let sleepT = {mode:null, until:0, t:null, chap:-1};
function curChapterIndex(){
  if (!isBook(current) || !(current.chapters || []).length || loadedId !== current.id) return -1;
  const t = audio.currentTime; let idx = 0;
  current.chapters.forEach((c, i) => { if (c.start <= t + 0.25) idx = i; });
  return idx;
}
function setSleep(mode, minutes){
  clearTimeout(sleepT.t); sleepT = {mode:null, until:0, t:null, chap:-1};
  if (mode === 'time') {
    sleepT = {mode, until:Date.now() + minutes * 60000, t:setTimeout(sleepFire, minutes * 60000), chap:-1};
    toast(`Sleep timer: ${minutes} min`);
  } else if (mode === 'end') {
    sleepT.mode = 'end'; sleepT.chap = curChapterIndex();
    toast(isBook(current) ? 'Stops at the end of this chapter' : 'Stops at the end of this song');
  } else toast('Sleep timer off');
  updateBar(); refresh();
}
function sleepFire(){
  clearTimeout(sleepT.t); sleepT = {mode:null, until:0, t:null, chap:-1};
  if (remote && spNow && spNow.playing) spControl('play');
  else if (!audio.paused) audio.pause();
  toast('Sleep timer — paused', 3000); updateBar(); refresh();
}
const sleepLabel = () => sleepT.mode === 'time' ? fmt((sleepT.until - Date.now()) / 1000) + ' left'
  : sleepT.mode === 'end' ? 'End of ' + (isBook(current) ? 'chapter' : 'song') : 'Off';

/* ---------- equalizer ---------- */
const EQ_FREQS = [60, 230, 910, 3600, 14000];
const EQ_PRESETS = {
  off:{name:'Off', g:[0,0,0,0,0]}, bass:{name:'Bass Booster', g:[6,4,0,0,0]}, bassdown:{name:'Bass Reducer', g:[-6,-3,0,0,0]},
  treble:{name:'Treble Booster', g:[0,0,0,3,6]}, vocal:{name:'Vocal Booster', g:[-2,0,4,3,0]}, rock:{name:'Rock', g:[4,2,-2,2,4]},
  pop:{name:'Pop', g:[-1,2,4,2,-1]}, jazz:{name:'Jazz', g:[3,1,-1,1,3]}, classical:{name:'Classical', g:[4,2,0,2,3]},
  loudness:{name:'Loudness', g:[5,1,0,1,5]}, spoken:{name:'Spoken Word', g:[-4,-1,3,3,0]}
};
let eq = null;
function applyEQ(){
  const p = EQ_PRESETS[settings.eq] || EQ_PRESETS.off;
  if (!eq) {
    if (settings.eq === 'off') return;
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      const src = actx.createMediaElementSource(audio), pre = actx.createGain();
      const filters = EQ_FREQS.map((f, i) => {
        const b = actx.createBiquadFilter();
        b.type = i === 0 ? 'lowshelf' : i === EQ_FREQS.length - 1 ? 'highshelf' : 'peaking';
        b.frequency.value = f; b.Q.value = 1; return b;
      });
      src.connect(pre); let node = pre; filters.forEach(b => { node.connect(b); node = b; }); node.connect(actx.destination);
      eq = {pre, filters};
      if (actx.state === 'suspended') actx.resume();
    } catch (e) { settings.eq = 'off'; saveSettings(); toast('The equalizer isn’t available here'); return; }
  }
  eq.filters.forEach((b, i) => { b.gain.value = p.g[i]; });
  eq.pre.gain.value = Math.pow(10, -Math.max(0, ...p.g) * 0.6 / 20);   // headroom so boosts don't clip
}
audio.addEventListener('loadedmetadata', async () => {
  if (current && loadedId === current.id && isFinite(audio.duration) && Math.abs((current.duration || 0) - audio.duration) > 1) {
    current.duration = audio.duration; try { await dbPut('meta', current); } catch (e) {}
  }

});
audio.addEventListener('error', () => {

  if (current && current.linked && loadedId === current.id) { missingIds.add(current.id); toast('Couldn’t open this file — scanning the music folder…', 3000); scanFolder(true); return; } if (audio.src && audio.src !== SILENT && loadedId) toast('This file can’t be played'); });

function setMedia(m){
  if (!('mediaSession' in navigator)) return;
  try {
    navigator.mediaSession.metadata = new MediaMetadata({title:m.title, artist:m.artist, album:m.album,
      artwork: m.art ? [{src:m.art, sizes:'240x240', type:'image/jpeg'}] : []});
  } catch (e) {}
}
if ('mediaSession' in navigator) {
  const h = (a, f) => { try { navigator.mediaSession.setActionHandler(a, f); } catch (e) {} };
  h('play', () => togglePlay()); h('pause', () => audio.pause());
  h('nexttrack', () => nextAction()); h('previoustrack', () => prevAction());
  h('seekforward', () => skipBy(30)); h('seekbackward', () => skipBy(-15));
}

const stack = [];
const top = () => stack[stack.length - 1];
function listView(title, items){ return {kind:'list', title, items, sel:0, _items:[]}; }
function push(v){ stack.push(v); render(); }
function back(){
  const v = top();
  if (v && v.selecting) { v.selecting = null; v.sel = Math.max(0, v.sel - SEL_HEAD); render(); return; }   // BACK leaves selection first
  if (stack.length > 1) { stack.pop(); render(); }
}
function refresh(){ render(); }

const SEL_HEAD = 4;
function selectHeader(v, list){

      if (!n) { toast('Select at least one song'); return; }

    {label:`Add ${n} to Quick List`, act:() => { if (!n) return; otgAdd(list.filter(s => v.selecting.has(s.id))); v.selecting = null; refresh(); }},
    {label: all ? 'Select None' : 'Select All', act:() => { v.selecting = new Set(all ? [] : list.map(s => s.id)); refresh(); }},
    {label:'Done', act:() => { v.selecting = null; v.sel = Math.max(0, v.sel - SEL_HEAD); refresh(); }}

}
function selectRows(v, list, subFn){
  return list.map(s => ({label:s.title, sub:subFn(s), r: v.selecting.has(s.id) ? '✓' : '○',
    act:() => { v.selecting.has(s.id) ? v.selecting.delete(s.id) : v.selecting.add(s.id); refresh(); }}));

function startSelect(v, s, i){
  v.selecting = new Set([s.id]); v.sel = i + SEL_HEAD; haptic('success'); refresh();
  toast('Tap songs to select them, then Edit Info', 2200);

function songsView(title, listFn, rFn, empty){
  const v = listView(title, () => {

function commonValue(list, key){ const v0 = list[0] ? list[0][key] : ''; return list.every(x => x[key] === v0) ? v0 : null; }
function editInfoView(ids, fromView){
  const draft = {};
  const v = listView(ids.length === 1 ? 'Edit Info' : `Edit ${ids.length} Songs`, () => {
    const list = ids.map(id => songs.find(s => s.id === id)).filter(Boolean);
    if (!list.length) return [{label:'Songs removed', act:back}];
    const show = key => key in draft ? draft[key] : (commonValue(list, key) ?? 'Mixed');
    const ask = (key, label, single) => {
      const cur = key in draft ? draft[key] : commonValue(list, key);
      const val = prompt(`${label}${list.length > 1 ? ` for ${list.length} songs` : ''}`, cur == null ? '' : String(cur));
      if (val === null) return;
      const t = val.trim();
      if (key === 'track') { const n = parseInt(t, 10); if (t && !(n >= 0)) { toast('Track must be a number'); return; } draft.track = t ? n : 0; }
      else if (!t) { if (single || cur != null) toast(label + ' can’t be empty'); return; }
      else draft[key] = t;
      refresh();
    };
    const rows = [];
    if (list.length === 1) rows.push({label:'Title', r:String(show('title')), act:() => ask('title', 'Title', true)});
    rows.push({label:'Artist', r:String(show('artist')), act:() => ask('artist', 'Artist')});
    rows.push({label:'Album', r:String(show('album')), act:() => ask('album', 'Album')});
    if (list.length === 1) rows.push({label:'Track Number', r: show('track') ? String(show('track')) : '—', act:() => ask('track', 'Track number', true)});
    else rows.push({label:'Number Tracks 1–' + list.length, sub:'In the order shown in the list', r: draft.renumber ? '✓' : '',
      act:() => { draft.renumber = !draft.renumber; refresh(); }});
    const changed = Object.keys(draft).length > 0;
    rows.push({label: changed ? 'Save Changes' : 'Save Changes (nothing changed)', act:() => saveInfo(list, draft, fromView)});

async function saveInfo(list, draft, fromView){
  if (!Object.keys(draft).length) { back(); return; }
  try {
    for (let i = 0; i < list.length; i++) {
      const s = list[i];
      if (!('origTitle' in s)) s.origTitle = s.title;          // keep what the file's tags said, for reconnecting
      if (!('origArtist' in s)) s.origArtist = s.artist;
      ['title', 'artist', 'album', 'track'].forEach(k => { if (k in draft) s[k] = draft[k]; });
      if (draft.renumber) s.track = i + 1;
      await dbPut('meta', s);
    }
  } catch (e) { toast('Couldn’t save: ' + ((e && e.message) || e), 3500); return; }
  if (current && list.includes(current)) setMedia(current);
  if (fromView) fromView.selecting = null;
  toast(`Updated ${list.length} song${list.length === 1 ? '' : 's'}`);
  back();
}

}

/* ---------- audiobooks ---------- */
function bookGroups(){
  const map = new Map();
  books().forEach(b => {
    const k = b.book || b.id;
    if (!map.has(k)) map.set(k, {key:k, title:b.bookTitle || b.title, author:b.artist, art:b.art, parts:[]});
    const g = map.get(k); g.parts.push(b); if (!g.art && b.art) g.art = b.art;
  });
  map.forEach(g => g.parts.sort((a, b) => (a.part - b.part) || a.file.localeCompare(b.file, undefined, {numeric:true})));
  return Array.from(map.values()).sort((a, b) => a.title.localeCompare(b.title, undefined, {sensitivity:'base'}));
}
const bookState = key => (settings.bookPos || {})[key] || null;
const bookTotal = g => g.parts.reduce((t, p) => t + (p.duration || 0), 0);
function bookElapsed(g){
  const st = bookState(g.key); if (!st || st.finished) return 0;
  let t = 0; for (const p of g.parts) { if (p.id === st.id) return t + (st.pos || 0); t += p.duration || 0; }
  return 0;
}
function bookProgress(g){
  const st = bookState(g.key);
  if (st && st.finished) return 'Finished';
  const tot = bookTotal(g), el = bookElapsed(g);
  if (!el) return 'Not started';
  return tot ? Math.min(99, Math.round(el / tot * 100)) + '%' : fmt(el);
}
function bookSave(m, pos, finished){
  if (!m) return;
  settings.bookPos = settings.bookPos || {};
  settings.bookPos[m.book || m.id] = {id:m.id, pos:pos || 0, finished:!!finished, at:Date.now()};
  saveSettings();
}
function playBook(g, partId, at){
  const i = Math.max(0, g.parts.findIndex(p => p.id === partId));
  playQueue(g.parts, i, at || 0, {inOrder:true});
  push(nowView());
}
function resumeBook(g){
  const st = bookState(g.key);
  if (st && !st.finished && g.parts.some(p => p.id === st.id)) playBook(g, st.id, st.pos);
  else playBook(g, g.parts[0].id, 0);
}
function bookChapters(g){
  if (g.parts.length > 1) return g.parts.map((p, i) => ({title:p.title || `Part ${i + 1}`, partId:p.id, start:0}));
  const p = g.parts[0];
  return (p.chapters || []).map(c => ({title:c.title, partId:p.id, start:c.start}));
}
const SPEEDS = [0.75, 1, 1.25, 1.5, 1.75, 2];
const speedLabel = () => (settings.bookSpeed || 1) + '×';
function cycleSpeed(){
  const i = SPEEDS.indexOf(settings.bookSpeed || 1);
  settings.bookSpeed = SPEEDS[(i + 1) % SPEEDS.length]; saveSettings(); applyRate();
  toast('Speed ' + speedLabel()); refresh();
}
const booksView = () => listView('Audiobooks', () => {
  const items = bookGroups().map(g => ({label:g.title, sub:`${g.author} · ${bookProgress(g)}`, arrow:true, act:() => push(bookView(g.key))}));
  if (!items.length) items.push({label:'No audiobooks yet', sub:'DRM-free books from Libro.fm, LibriVox or your own files'});
  items.push({label:'Add Audiobook…', sub:'MP3, M4A or M4B · pick all parts of a book together', act:pickBook});
  items.push({label:'Playback Speed', r:speedLabel(), act:cycleSpeed});
  return items;
});
function bookView(key){
  const g0 = bookGroups().find(g => g.key === key);
  return listView(g0 ? g0.title : 'Audiobook', () => {
    const g = bookGroups().find(x => x.key === key);
    if (!g) return [{label:'Audiobook removed', act:back}];
    const st = bookState(key), started = !!st && !st.finished && bookElapsed(g) > 5;
    const items = [{label: started ? `Resume · ${fmt(bookElapsed(g))}` : (st && st.finished ? 'Listen Again' : 'Play'),
      sub:`${g.author} · ${fmt(bookTotal(g))} · ${bookProgress(g)}`, act:() => resumeBook(g)}];
    const chs = bookChapters(g);
    if (chs.length > 1) items.push({label: g.parts.length > 1 ? 'Parts' : 'Chapters', r:String(chs.length), arrow:true, act:() => push(chaptersView(key))});
    if (started) items.push({label:'Start Over', act:() => playBook(g, g.parts[0].id, 0)});
    items.push({label:'Playback Speed', r:speedLabel(), act:cycleSpeed});
    items.push({label:'Delete Audiobook', act:async () => {
      if (!confirm(`Delete “${g.title}”?`)) return;
      for (const p of g.parts) await deleteSong(p.id);
      if (settings.bookPos) { delete settings.bookPos[key]; saveSettings(); }
      back(); }});
    return items;
  });
}
function chaptersView(key){
  return listView('Chapters', () => {
    const g = bookGroups().find(x => x.key === key); if (!g) return [{label:'Audiobook removed', act:back}];
    const here = isBook(current) && (current.book || current.id) === key;

/* ---------- Album Flip ---------- */
function albumList(){
  const map = new Map();
  music().forEach(s => {
    const k = s.album + '\u0000' + s.artist;
    if (!map.has(k)) map.set(k, {album:s.album, artist:s.artist, art:s.art, songs:[]});
    const a = map.get(k); a.songs.push(s); if (!a.art && s.art) a.art = s.art;
  });
  map.forEach(a => a.songs.sort((x, y) => (x.track - y.track) || byTitle(x, y)));
  return Array.from(map.values()).sort((a, b) => a.album.localeCompare(b.album, undefined, {sensitivity:'base'}));
}
function flowView(){ return {kind:'flow', title:'Album Flip', sel:0}; }
let flowEls = new Map();
function renderFlow(v){
  v._albums = albumList();
  const body = $('#body');
  if (!v._albums.length) { body.innerHTML = '<div class="empty">No albums yet.<br>Add music first.</div>'; return; }
  v.sel = Math.min(Math.max(0, v.sel), v._albums.length - 1);
  body.innerHTML = '<div class="flow"><div class="stage" id="stage"></div><div class="flow-cap"><div class="t" id="flowT"></div><div class="a" id="flowA"></div></div></div>';
  flowEls = new Map(); drawFlow(v);
}
function drawFlow(v){
  const stage = $('#stage'); if (!stage || !v._albums) return;
  const W = stage.clientWidth || 300, H = stage.clientHeight || 200;
  const S = Math.max(60, Math.min(H * 0.64, W * 0.46));
  const keep = new Set();
  for (let i = Math.max(0, v.sel - 4); i <= Math.min(v._albums.length - 1, v.sel + 4); i++) {
    keep.add(i);
    let el = flowEls.get(i);
    if (!el) {
      const a = v._albums[i];
      el = document.createElement('div'); el.className = 'cover'; el.dataset.i = String(i);
      el.innerHTML = a.art ? `<img src="${a.art}" alt="">` : '♪';
      stage.appendChild(el); flowEls.set(i, el);
    }
    const d = i - v.sel, ad = Math.abs(d), sg = Math.sign(d);
    const x = d === 0 ? 0 : sg * (S * 0.62 + (ad - 1) * S * 0.24);
    el.style.width = el.style.height = S + 'px';
    el.style.marginLeft = (-S / 2) + 'px';
    el.style.top = Math.max(4, (H - S) * 0.3) + 'px';
    el.style.transform = `translateX(${x}px) translateZ(${d === 0 ? 0 : -S * 0.45}px) rotateY(${d === 0 ? 0 : -sg * 62}deg)`;
    el.style.zIndex = String(100 - ad);
  }
  flowEls.forEach((el, i) => { if (!keep.has(i)) { el.remove(); flowEls.delete(i); } });
  const a = v._albums[v.sel];
  $('#flowT').textContent = a.album; $('#flowA').textContent = a.artist;
}
function flowOpen(v){
  const a = v._albums && v._albums[v.sel]; if (!a) return;
  push(songsView(a.album, () => albumList().find(x => x.album === a.album && x.artist === a.artist)?.songs || []));
}

/* ---------- Brick ---------- */
let game = null;
function brickView(){ return {kind:'game', title:'Brick'}; }
function brickColors(){
  const cs = getComputedStyle(document.documentElement), col = k => (cs.getPropertyValue('--' + k) || '').trim() || '#888';
  return {bg:col('screen'), fg:col('fg'), dim:col('dim'), rows:[col('hi1'), col('fg'), col('hi2'), col('dim')]};
}
function startBrick(v){
  const body = $('#body');
  body.innerHTML = '<canvas class="cv" id="cv"></canvas>';
  const cv = $('#cv'), r = body.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  const W = Math.max(200, r.width || 300), H = Math.max(150, r.height || 220);
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  let ctx = null; try { ctx = cv.getContext('2d'); } catch (e) {}
  if (!ctx) { body.innerHTML = '<div class="empty">Games aren’t supported here.</div>'; return; }
  ctx.scale(dpr, dpr);
  game = {v, cv, ctx, W, H, score:0, lives:3, level:1, state:'ready', last:0, col:brickColors()};
  brickLevel();
  const g = game;
  cv.addEventListener('pointerdown', e => { e.preventDefault(); g.drag = {x:e.clientX, moved:false}; });
  cv.addEventListener('pointermove', e => {
    if (!g.drag) return;
    const rr = cv.getBoundingClientRect();
    g.px = Math.min(g.W - g.pw, Math.max(0, e.clientX - rr.left - g.pw / 2));
    if (Math.abs(e.clientX - g.drag.x) > 6) g.drag.moved = true;
    if (g.state === 'ready') g.bx = g.px + g.pw / 2;
  });
  cv.addEventListener('pointerup', () => { if (g.drag && !g.drag.moved) brickCenter(); g.drag = null; });
  g.raf = requestAnimationFrame(brickLoop);
}
function brickLevel(){
  const g = game, cols = 8, rows = 4 + Math.min(3, g.level - 1), topY = 26, gap = 3;
  const bw = (g.W - gap * (cols + 1)) / cols, bh = Math.max(8, g.H * 0.045);
  g.bricks = [];
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++)
    g.bricks.push({x:gap + c * (bw + gap), y:topY + r * (bh + gap), w:bw, h:bh, row:r, alive:true});
  g.pw = g.W * 0.24; g.ph = 7; g.px = (g.W - g.pw) / 2; g.py = g.H - 16;
  brickServe();
}
function brickServe(){
  const g = game;
  g.br = Math.max(4, g.W * 0.014); g.bx = g.px + g.pw / 2; g.by = g.py - g.br - 1; g.vx = 0; g.vy = 0;
  g.state = g.lives > 0 ? 'ready' : 'over';
}
function brickLaunch(){
  const g = game, sp = g.H * (0.8 + 0.1 * (g.level - 1)), ang = (-60 - Math.random() * 60) * Math.PI / 180;
  g.vx = Math.cos(ang) * sp; g.vy = Math.sin(ang) * sp; g.state = 'play';
}
function brickCenter(){
  const g = game; if (!g) return;
  if (g.state === 'over') { g.score = 0; g.lives = 3; g.level = 1; brickLevel(); }
  else if (g.state === 'ready') brickLaunch();
  else if (g.state === 'play') g.state = 'paused';
  else if (g.state === 'paused') g.state = 'play';
}
function brickMove(dir){
  const g = game; if (!g) return;
  g.px = Math.min(g.W - g.pw, Math.max(0, g.px + dir * g.W / 14));
  if (g.state === 'ready') g.bx = g.px + g.pw / 2;
}
function brickLoop(t){
  const g = game;
  if (!g || top() !== g.v) { game = null; return; }
  const dt = g.last ? Math.min(0.04, (t - g.last) / 1000) : 0; g.last = t;
  if (g.state === 'play' && !document.hidden) brickStep(dt);
  brickDraw(); g.raf = requestAnimationFrame(brickLoop);
}
function brickStep(dt){
  const g = game;
  g.bx += g.vx * dt; g.by += g.vy * dt;
  if (g.bx < g.br) { g.bx = g.br; g.vx = Math.abs(g.vx); }
  if (g.bx > g.W - g.br) { g.bx = g.W - g.br; g.vx = -Math.abs(g.vx); }
  if (g.by < g.br + 18) { g.by = g.br + 18; g.vy = Math.abs(g.vy); }
  if (g.vy > 0 && g.by + g.br >= g.py && g.by + g.br <= g.py + g.ph + 8 && g.bx >= g.px - g.br && g.bx <= g.px + g.pw + g.br) {
    const hit = ((g.bx - g.px) / g.pw) * 2 - 1, sp = Math.hypot(g.vx, g.vy) * 1.01, ang = (-90 + Math.max(-1, Math.min(1, hit)) * 60) * Math.PI / 180;
    g.vx = Math.cos(ang) * sp; g.vy = Math.sin(ang) * sp; g.by = g.py - g.br; haptic('light');
  }
  for (const b of g.bricks) {
    if (!b.alive) continue;
    if (g.bx + g.br > b.x && g.bx - g.br < b.x + b.w && g.by + g.br > b.y && g.by - g.br < b.y + b.h) {
      b.alive = false; g.score += 10; haptic('selection');
      const ox = Math.min(g.bx + g.br - b.x, b.x + b.w - (g.bx - g.br)), oy = Math.min(g.by + g.br - b.y, b.y + b.h - (g.by - g.br));
      if (ox < oy) g.vx = -g.vx; else g.vy = -g.vy;
      break;
    }
  }
  if (g.bricks.every(b => !b.alive)) { g.level++; g.score += 100; haptic('success'); brickLevel(); return; }
  if (g.by - g.br > g.H) {
    g.lives--; haptic('error');
    if (g.lives <= 0 && g.score > (settings.brickHigh || 0)) { settings.brickHigh = g.score; saveSettings(); }
    brickServe();
  }
}
function brickDraw(){
  const g = game, c = g.ctx, k = g.col;
  c.fillStyle = k.bg; c.fillRect(0, 0, g.W, g.H);
  g.bricks.forEach(b => { if (!b.alive) return; c.fillStyle = k.rows[b.row % k.rows.length]; c.fillRect(b.x, b.y, b.w, b.h); });
  c.fillStyle = k.fg; c.fillRect(g.px, g.py, g.pw, g.ph);
  c.beginPath(); c.arc(g.bx, g.by, g.br, 0, Math.PI * 2); c.fill();
  c.fillStyle = k.dim; c.font = '600 12px -apple-system, Helvetica, Arial, sans-serif'; c.textBaseline = 'top';
  c.textAlign = 'left'; c.fillText(`Score ${g.score}`, 6, 4);
  c.textAlign = 'right'; c.fillText(`${'●'.repeat(Math.max(0, g.lives))}  Lv ${g.level}`, g.W - 6, 4);
  const msg = g.state === 'ready' ? 'Press OK to launch' : g.state === 'paused' ? 'Paused'
    : g.state === 'over' ? `Game over · Best ${settings.brickHigh || 0}` : '';
  if (msg) {
    c.textAlign = 'center'; c.fillStyle = k.fg; c.font = '600 14px -apple-system, Helvetica, Arial, sans-serif';
    c.fillText(msg, g.W / 2, g.H * 0.6);
    if (g.state === 'over') { c.font = '12px -apple-system, Helvetica, Arial, sans-serif'; c.fillStyle = k.dim; c.fillText('Press OK to play again', g.W / 2, g.H * 0.6 + 20); }
  }
}

  }

/* ---------- full backup (audio included) ----------
   Format: "CWPBAK01" + 4-byte header length + JSON header + audio files back to back.
   Backups from the earlier player use the same format and restore here too. */
const BACKUP_MAGIC = 'CWPBAK01';
async function backupLibrary(){
  if (!songs.length && !playlists.length) { toast('Nothing to back up yet'); return; }
  toast('Preparing backup…', 600000);
  try {
    const parts = [], entries = []; let offset = 0;
    for (const s of songs) {
      const data = await dbGet('audio', s.id); if (!data) continue;
      const blob = data instanceof Blob ? data : new Blob([data], {type:s.type});
      entries.push({meta:s, offset, size:blob.size}); parts.push(blob); offset += blob.size;
    }
    const header = {app:'mp3-player', version:1, created:new Date().toISOString(), songs:entries,
      playlists, otg:settings.otg || [], bookPos:settings.bookPos || {}};
    const hb = new TextEncoder().encode(JSON.stringify(header));
    const lb = new Uint8Array(4); new DataView(lb.buffer).setUint32(0, hb.length);
    const file = new Blob([new TextEncoder().encode(BACKUP_MAGIC), lb, hb].concat(parts), {type:'application/octet-stream'});
    const date = new Date().toISOString().slice(0, 10);
    downloadBlob(file, `mp3-player-backup-${date}.cwpbackup`);
    toast(`Backup ready · ${(file.size / 1048576).toFixed(1)} MB`, 3500);
  } catch (e) { toast('Backup failed: ' + ((e && e.message) || e), 4000); }
}
async function restoreLibrary(file){
  try {
    const magic = new TextDecoder().decode(await file.slice(0, 8).arrayBuffer());
    if (magic !== BACKUP_MAGIC) { toast('That isn’t a player backup file', 3500); return; }
    const len = new DataView(await file.slice(8, 12).arrayBuffer()).getUint32(0);
    const header = JSON.parse(new TextDecoder().decode(await file.slice(12, 12 + len).arrayBuffer()));
    const base = 12 + len; let added = 0, skipped = 0, n = 0;
    for (const e of header.songs || []) {
      n++;
      const m = e.meta;
      if (!m || songs.some(s => s.id === m.id || (s.file === m.file && s.size === m.size && (s.kind || 'song') === (m.kind || 'song')))) { skipped++; continue; }
      toast(`Restoring ${n} of ${header.songs.length}…`, 600000);
      await storeAudio(m.id, file.slice(base + e.offset, base + e.offset + e.size, m.type));
      await dbPut('meta', m); songs.push(m); added++;
    }
    for (const pl of header.playlists || []) {
      if (playlists.some(p => p.id === pl.id)) continue;
      await dbPut('playlists', pl); playlists.push(pl);
    }
    const have = new Set(settings.otg || []);
    settings.otg = (settings.otg || []).concat((header.otg || []).filter(id => !have.has(id)));
    settings.bookPos = Object.assign({}, header.bookPos || {}, settings.bookPos || {});
    saveSettings();
    toast(`Restored ${added} file${added === 1 ? '' : 's'}` + (skipped ? ` · ${skipped} already here` : ''), 3500);
    refresh();
  } catch (e) { toast('Restore failed: ' + ((e && e.message) || e), 4000); }
}
$('#pickBackup').addEventListener('change', e => { const f = (e.target.files || [])[0]; if (f) restoreLibrary(f); });

/* ---------- rendering ---------- */
const fmt = s => { s = Math.max(0, Math.floor(s || 0)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
function render(){
  const v = top(), body = $('#body');
  $('#title').textContent = v.title;
  if (v.kind === 'list') {
    v._items = v.items();
    v.sel = Math.min(Math.max(0, v.sel), Math.max(0, v._items.length - 1));

      const loose = songs.filter(isLoose).length;
      if (loose && canOrganize() && !localStorage.getItem('mp3p-organize-asked')) {
        localStorage.setItem('mp3p-organize-asked', String(Date.now()));
        if (confirm(`${loose} song${loose === 1 ? ' is' : 's are'} loose at the top of your music folder. Sort ${loose === 1 ? 'it' : 'them'} into Music › Artist › Album folders?`)) await organizeFolder(false);
      } })
    .then(() => checkMissing()).then(n => { if (n) { toast(`${n} song${n === 1 ? '' : 's'} need reconnecting — Settings → Reconnect Music`, 4000); refresh(); } });
  else if (songs.length) checkMissing().then(n => { if (n) { toast(`${n} song${n === 1 ? '' : 's'} need reconnecting — Settings → Reconnect Music`, 4000); refresh(); } });
}
start();
})();
</script>
</body>
</html>
