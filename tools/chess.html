<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#140e0a">
<title>Chess 3D</title>
<style>
:root{--gold:#d9b46a;--gold2:#f1d79c;--ink:#f6ecdc;--mute:rgba(246,236,220,.62);--glass:rgba(24,16,11,.58);--line:rgba(255,226,180,.13);
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:#120c08}
body{font:15px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;color:var(--ink);-webkit-user-select:none;user-select:none;
  background:radial-gradient(120% 90% at 50% 38%,#4a3424 0%,#2a1c13 45%,#100a07 100%)}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;opacity:0;transition:opacity .8s ease}
body.ready #c{opacity:1}
.serif{font-family:"Iowan Old Style","Palatino",Georgia,serif}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(16px) saturate(1.3);backdrop-filter:blur(16px) saturate(1.3);border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.35)}
#top{position:fixed;left:0;right:0;top:0;padding:calc(var(--st) + 10px) calc(var(--sr) + 14px) 0 calc(var(--sl) + 14px);display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
#status{pointer-events:auto;display:flex;align-items:center;gap:10px;padding:9px 16px 9px 12px;border-radius:999px;font-weight:600;letter-spacing:.2px;transition:background .3s,border-color .3s}
#status.check{border-color:rgba(255,90,70,.55);background:rgba(90,20,14,.62)}
#status.busy #statusText::after{content:"";display:inline-block;width:1.2em;text-align:left;animation:dots 1.2s steps(4) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
.dot{width:14px;height:14px;border-radius:50%;box-shadow:0 0 0 2px rgba(217,180,106,.7)}
.dot.w{background:linear-gradient(145deg,#fff,#d8ccb6)}.dot.b{background:linear-gradient(145deg,#4b3b31,#120c09)}
#subRow{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--mute)}
#adv{padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--gold2)}
#bottom{position:fixed;left:0;right:0;bottom:0;padding:0 calc(var(--sr) + 12px) calc(var(--sb) + 12px) calc(var(--sl) + 12px);display:flex;flex-direction:column;align-items:center;gap:9px;pointer-events:none}
#moves{pointer-events:auto;max-width:min(680px,100%);width:100%;overflow-x:auto;white-space:nowrap;padding:8px 12px;border-radius:14px;font-size:14px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
#moves::-webkit-scrollbar{display:none}
.mv{display:inline-block;margin-right:12px}.mv b{color:var(--gold);font-weight:600;margin-right:2px}
.empty{color:var(--mute);font-size:13px}
#bar{pointer-events:auto;display:flex;gap:6px;padding:6px;border-radius:20px}
#bar button{appearance:none;border:0;background:transparent;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:3px;min-width:68px;padding:7px 8px 6px;border-radius:14px;font-weight:600;font-size:11.5px;font-family:inherit;letter-spacing:.3px}
#bar button:active{background:rgba(255,230,190,.1)}
#bar button:disabled{opacity:.35}
#bar svg{width:24px;height:24px;stroke:var(--gold2);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.modal{position:fixed;inset:0;display:flex;align-items:flex-end;justify-content:center;background:rgba(8,5,3,.45);opacity:0;pointer-events:none;transition:opacity .25s;z-index:10;padding:0 calc(var(--sr) + 10px) calc(var(--sb) + 10px) calc(var(--sl) + 10px)}
.modal.center{align-items:center}
.modal.show{opacity:1;pointer-events:auto}
.card{width:100%;max-width:430px;border-radius:26px;padding:20px 18px 18px;transform:translateY(24px) scale(.98);transition:transform .3s cubic-bezier(.2,.9,.3,1.2);background:rgba(30,21,15,.86)}
.modal.show .card{transform:none}
.card h2{margin:0 0 2px;font-size:26px;font-weight:600;color:var(--gold2);text-align:center}
.card .lead{margin:0 0 16px;text-align:center;color:var(--mute);font-size:13.5px}
.label{font-size:12px;text-transform:uppercase;letter-spacing:1.2px;color:var(--mute);margin:14px 2px 7px}
.seg{display:flex;background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:13px;padding:3px;gap:3px}
.seg button{flex:1;appearance:none;border:0;background:transparent;color:var(--ink);padding:10px 4px;border-radius:10px;font-weight:600;font-size:14px;font-family:inherit}
.seg button.on{background:linear-gradient(180deg,#e7c98a,#b98f48);color:#24170c;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.row{display:flex;align-items:center;justify-content:space-between;padding:11px 2px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.sw{position:relative;width:50px;height:30px;flex:none}
.sw input{opacity:0;width:0;height:0}
.sw span{position:absolute;inset:0;border-radius:99px;background:rgba(255,255,255,.16);transition:.2s}
.sw span::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#f4ead8;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.4)}
.sw input:checked+span{background:#b98f48}.sw input:checked+span::after{transform:translateX(20px)}
.btns{display:flex;gap:10px;margin-top:18px}
.btn{flex:1;appearance:none;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--ink);padding:14px;border-radius:15px;font-weight:600;font-size:16px;font-family:inherit}
.btn.primary{border:0;background:linear-gradient(180deg,#ecd096,#b98f48);color:#24170c;box-shadow:0 6px 18px rgba(185,143,72,.3)}
.btn:active{transform:scale(.98)}
#promoBtns{display:flex;justify-content:center;gap:10px}
.promo{appearance:none;width:68px;height:78px;border-radius:16px;border:1px solid var(--line);background:rgba(255,255,255,.07);color:var(--ink);font-size:44px;line-height:1}
.promo:active{background:rgba(217,180,106,.3)}
#overIcon{font-size:64px;text-align:center;line-height:1;margin-bottom:6px;color:var(--gold2);text-shadow:0 4px 20px rgba(217,180,106,.4)}
@media (orientation:landscape) and (max-height:520px){
  #top{align-items:flex-start;padding-top:calc(var(--st) + 8px)}
  #subRow{display:none}
  #bottom{left:auto;top:0;flex-direction:column;justify-content:center;padding:calc(var(--st) + 8px) calc(var(--sr) + 10px) calc(var(--sb) + 8px) 0}
  #moves{display:none}
  #bar{flex-direction:column;gap:2px}
  #bar button{min-width:60px;padding:6px}
  .card{max-height:calc(100vh - 20px);overflow:auto}
}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="top">
  <div id="status" class="glass"><span id="turnDot" class="dot w"></span><span id="statusText">White to move</span></div>
  <div id="subRow"><span id="sub"></span><span id="adv">Even</span></div>
</div>

<div id="bottom">
  <div id="moves" class="glass serif"></div>
  <div id="bar" class="glass">
    <button id="bNew"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>New</button>
    <button id="bUndo"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>Undo</button>
    <button id="bHint"><svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.6 10.8c.8.6 1.1 1.4 1.1 2.2h5c0-.8.3-1.6 1.1-2.2A6 6 0 0 0 12 3z"/></svg>Hint</button>
    <button id="bView"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 15.5-6.2L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15.5 6.2L3 16"/><path d="M3 21v-5h5"/></svg>Flip</button>
  </div>
</div>

<div id="sheet" class="modal">
  <div class="card glass">
    <h2 class="serif">New Game</h2>
    <p class="lead">Choose your opponent and side</p>
    <div class="label">Opponent</div>
    <div class="seg" id="segMode"><button data-v="ai" class="on">Computer</button><button data-v="2p">Two Players</button></div>
    <div id="aiOpts">
      <div class="label">You play</div>
      <div class="seg" id="segColor"><button data-v="w" class="on">White</button><button data-v="b">Black</button><button data-v="r">Random</button></div>
      <div class="label">Strength</div>
      <div class="seg" id="segLevel"><button data-v="1">Easy</button><button data-v="2" class="on">Medium</button><button data-v="3">Hard</button><button data-v="4">Expert</button></div>
    </div>
    <div class="label">Options</div>
    <div>
      <label class="row"><span>Show legal moves</span><span class="sw"><input type="checkbox" id="tHints" checked><span></span></span></label>
      <label class="row"><span>Sounds</span><span class="sw"><input type="checkbox" id="tSound" checked><span></span></span></label>
      <label class="row" id="rotRow"><span>Turn board each move</span><span class="sw"><input type="checkbox" id="tRotate" checked><span></span></span></label>
    </div>
    <div class="btns"><button class="btn" id="bCancel">Cancel</button><button class="btn primary" id="bStart">Start</button></div>
  </div>
</div>

<div id="promo" class="modal center">
  <div class="card glass">
    <h2 class="serif">Promote pawn</h2>
    <p class="lead">Pick the piece your pawn becomes</p>
    <div id="promoBtns"></div>
  </div>
</div>

<div id="over" class="modal center">
  <div class="card glass">
    <div id="overIcon" class="serif">♔</div>
    <h2 class="serif" id="overTitle">Checkmate</h2>
    <p class="lead" id="overSub">White wins</p>
    <div class="btns"><button class="btn" id="overClose">View Board</button><button class="btn primary" id="overNew">New Game</button></div>
  </div>
</div>

<script>function ChessEngine() {
  'use strict';
  var PV = [0, 100, 320, 330, 500, 900, 0];
  var NOFF = [33, 31, 18, 14, -33, -31, -18, -14];
  var BOFF = [17, 15, -17, -15];
  var ROFF = [16, -16, 1, -1];
  var KOFF = [17, 15, -17, -15, 16, -16, 1, -1];
  var FILES = 'abcdefgh', RANKS = '12345678';
  var MATE = 100000, INF = 1000000;

  var PST = [];
  PST[1] = [0,0,0,0,0,0,0,0, 50,50,50,50,50,50,50,50, 10,10,20,30,30,20,10,10, 5,5,10,25,25,10,5,5, 0,0,0,20,20,0,0,0, 5,-5,-10,0,0,-10,-5,5, 5,10,10,-20,-20,10,10,5, 0,0,0,0,0,0,0,0];
  PST[2] = [-50,-40,-30,-30,-30,-30,-40,-50, -40,-20,0,0,0,0,-20,-40, -30,0,10,15,15,10,0,-30, -30,5,15,20,20,15,5,-30, -30,0,15,20,20,15,0,-30, -30,5,10,15,15,10,5,-30, -40,-20,0,5,5,0,-20,-40, -50,-40,-30,-30,-30,-30,-40,-50];
  PST[3] = [-20,-10,-10,-10,-10,-10,-10,-20, -10,0,0,0,0,0,0,-10, -10,0,5,10,10,5,0,-10, -10,5,5,10,10,5,5,-10, -10,0,10,10,10,10,0,-10, -10,10,10,10,10,10,10,-10, -10,5,0,0,0,0,5,-10, -20,-10,-10,-10,-10,-10,-10,-20];
  PST[4] = [0,0,0,0,0,0,0,0, 5,10,10,10,10,10,10,5, -5,0,0,0,0,0,0,-5, -5,0,0,0,0,0,0,-5, -5,0,0,0,0,0,0,-5, -5,0,0,0,0,0,0,-5, -5,0,0,0,0,0,0,-5, 0,0,0,5,5,0,0,0];
  PST[5] = [-20,-10,-10,-5,-5,-10,-10,-20, -10,0,0,0,0,0,0,-10, -10,0,5,5,5,5,0,-10, -5,0,5,5,5,5,0,-5, 0,0,5,5,5,5,0,-5, -10,5,5,5,5,5,0,-10, -10,0,5,0,0,0,0,-10, -20,-10,-10,-5,-5,-10,-10,-20];
  PST[6] = [-30,-40,-40,-50,-50,-40,-40,-30, -30,-40,-40,-50,-50,-40,-40,-30, -30,-40,-40,-50,-50,-40,-40,-30, -30,-40,-40,-50,-50,-40,-40,-30, -20,-30,-30,-40,-40,-30,-30,-20, -10,-20,-20,-20,-20,-20,-20,-10, 20,20,0,0,0,0,20,20, 20,30,10,0,0,10,30,20];
  var KEND = [-50,-40,-30,-20,-20,-30,-40,-50, -30,-20,-10,0,0,-10,-20,-30, -30,-10,20,30,30,20,-10,-30, -30,-10,30,40,40,30,-10,-30, -30,-10,30,40,40,30,-10,-30, -30,-10,20,30,30,20,-10,-30, -30,-30,0,0,0,0,-30,-30, -50,-30,-30,-30,-30,-30,-30,-50];

  var seed = 0x2545F491;
  function rnd() { seed ^= seed << 13; seed ^= seed >>> 17; seed ^= seed << 5; return seed | 0; }
  var ZP = [];
  for (var i = 0; i < 13; i++) { ZP[i] = new Int32Array(128); for (var s = 0; s < 128; s++) ZP[i][s] = rnd(); }
  var ZS = rnd();
  var ZC = new Int32Array(16); for (i = 0; i < 16; i++) ZC[i] = rnd();
  var ZE = new Int32Array(128); for (i = 0; i < 128; i++) ZE[i] = rnd();
  var CM = new Uint8Array(128); CM.fill(15);
  CM[0] = 13; CM[7] = 14; CM[4] = 12; CM[112] = 7; CM[119] = 11; CM[116] = 3;

  function Pos() {
    this.b = new Int8Array(128); this.side = 1; this.castle = 15; this.ep = -1;
    this.half = 0; this.full = 1; this.wk = 4; this.bk = 116; this.hash = 0;
    this.stack = []; this.hashes = [];
  }
  Pos.prototype.reset = function () {
    var back = [4, 2, 3, 5, 6, 3, 2, 4], b = this.b; b.fill(0);
    for (var f = 0; f < 8; f++) { b[f] = back[f]; b[16 + f] = 1; b[96 + f] = -1; b[112 + f] = -back[f]; }
    this.side = 1; this.castle = 15; this.ep = -1; this.half = 0; this.full = 1;
    this.wk = 4; this.bk = 116; this.stack = []; this.hashes = []; this.hash = this.computeHash();
  };
  Pos.prototype.computeHash = function () {
    var h = 0, b = this.b;
    for (var s = 0; s < 128; s++) { if (s & 0x88) { s += 7; continue; } if (b[s]) h ^= ZP[b[s] + 6][s]; }
    if (this.side === -1) h ^= ZS; h ^= ZC[this.castle]; if (this.ep >= 0) h ^= ZE[this.ep];
    return h;
  };
  Pos.prototype.attacked = function (sq, by) {
    var b = this.b, s, o, k, p;
    if (by === 1) { s = sq - 15; if (!(s & 0x88) && b[s] === 1) return true; s = sq - 17; if (!(s & 0x88) && b[s] === 1) return true; }
    else { s = sq + 15; if (!(s & 0x88) && b[s] === -1) return true; s = sq + 17; if (!(s & 0x88) && b[s] === -1) return true; }
    for (k = 0; k < 8; k++) { s = sq + NOFF[k]; if (!(s & 0x88) && b[s] === 2 * by) return true; }
    for (k = 0; k < 8; k++) { s = sq + KOFF[k]; if (!(s & 0x88) && b[s] === 6 * by) return true; }
    for (k = 0; k < 4; k++) { o = BOFF[k]; s = sq + o; while (!(s & 0x88)) { p = b[s]; if (p) { if (p === 3 * by || p === 5 * by) return true; break; } s += o; } }
    for (k = 0; k < 4; k++) { o = ROFF[k]; s = sq + o; while (!(s & 0x88)) { p = b[s]; if (p) { if (p === 4 * by || p === 5 * by) return true; break; } s += o; } }
    return false;
  };
  Pos.prototype.inCheck = function (side) { return this.attacked(side === 1 ? this.wk : this.bk, -side); };

  function mv(f, t, p, c, pr, fl) { return { f: f, t: t, p: p, c: c, pr: pr, fl: fl }; }

  Pos.prototype.gen = function (caps) {
    var b = this.b, us = this.side, out = [], sq, p, t, k, o, s, q;
    for (sq = 0; sq < 128; sq++) {
      if (sq & 0x88) { sq += 7; continue; }
      p = b[sq]; if (!p || (p > 0) !== (us > 0)) continue;
      t = p * us;
      if (t === 1) {
        var dir = 16 * us, to = sq + dir, startR = us === 1 ? 1 : 6, promoR = us === 1 ? 7 : 0;
        if (!(to & 0x88) && !b[to]) {
          if ((to >> 4) === promoR) { out.push(mv(sq, to, p, 0, 5, 0)); if (!caps) { out.push(mv(sq, to, p, 0, 2, 0)); out.push(mv(sq, to, p, 0, 4, 0)); out.push(mv(sq, to, p, 0, 3, 0)); } }
          else if (!caps) { out.push(mv(sq, to, p, 0, 0, 0)); if ((sq >> 4) === startR && !b[to + dir]) out.push(mv(sq, to + dir, p, 0, 0, 4)); }
        }
        for (k = -1; k <= 1; k += 2) {
          s = to + k; if (s & 0x88) continue;
          q = b[s];
          if (q && (q > 0) !== (us > 0)) {
            if ((s >> 4) === promoR) { out.push(mv(sq, s, p, q, 5, 0)); if (!caps) { out.push(mv(sq, s, p, q, 2, 0)); out.push(mv(sq, s, p, q, 4, 0)); out.push(mv(sq, s, p, q, 3, 0)); } }
            else out.push(mv(sq, s, p, q, 0, 0));
          } else if (s === this.ep) out.push(mv(sq, s, p, -us, 0, 1));
        }
      } else if (t === 2 || t === 6) {
        var offs = t === 2 ? NOFF : KOFF;
        for (k = 0; k < 8; k++) {
          s = sq + offs[k]; if (s & 0x88) continue; q = b[s];
          if (!q) { if (!caps) out.push(mv(sq, s, p, 0, 0, 0)); }
          else if ((q > 0) !== (us > 0)) out.push(mv(sq, s, p, q, 0, 0));
        }
        if (t === 6 && !caps) {
          if (us === 1 && sq === 4) {
            if ((this.castle & 1) && !b[5] && !b[6] && b[7] === 4 && !this.attacked(4, -1) && !this.attacked(5, -1) && !this.attacked(6, -1)) out.push(mv(4, 6, p, 0, 0, 2));
            if ((this.castle & 2) && !b[3] && !b[2] && !b[1] && b[0] === 4 && !this.attacked(4, -1) && !this.attacked(3, -1) && !this.attacked(2, -1)) out.push(mv(4, 2, p, 0, 0, 2));
          } else if (us === -1 && sq === 116) {
            if ((this.castle & 4) && !b[117] && !b[118] && b[119] === -4 && !this.attacked(116, 1) && !this.attacked(117, 1) && !this.attacked(118, 1)) out.push(mv(116, 118, p, 0, 0, 2));
            if ((this.castle & 8) && !b[115] && !b[114] && !b[113] && b[112] === -4 && !this.attacked(116, 1) && !this.attacked(115, 1) && !this.attacked(114, 1)) out.push(mv(116, 114, p, 0, 0, 2));
          }
        }
      } else {
        var dirs = t === 3 ? BOFF : t === 4 ? ROFF : KOFF;
        for (k = 0; k < dirs.length; k++) {
          o = dirs[k]; s = sq + o;
          while (!(s & 0x88)) {
            q = b[s];
            if (!q) { if (!caps) out.push(mv(sq, s, p, 0, 0, 0)); }
            else { if ((q > 0) !== (us > 0)) out.push(mv(sq, s, p, q, 0, 0)); break; }
            s += o;
          }
        }
      }
    }
    return out;
  };

  Pos.prototype.make = function (m) {
    var b = this.b, us = this.side, h = this.hash;
    this.stack.push([m, this.castle, this.ep, this.half, h]); this.hashes.push(h);
    h ^= ZP[m.p + 6][m.f];
    if (m.c) {
      if (m.fl & 1) { var cs = m.t - 16 * us; h ^= ZP[b[cs] + 6][cs]; b[cs] = 0; }
      else h ^= ZP[m.c + 6][m.t];
    }
    var np = m.pr ? m.pr * us : m.p;
    b[m.t] = np; b[m.f] = 0; h ^= ZP[np + 6][m.t];
    if (m.fl & 2) {
      var rf, rt;
      if (m.t === 6) { rf = 7; rt = 5; } else if (m.t === 2) { rf = 0; rt = 3; } else if (m.t === 118) { rf = 119; rt = 117; } else { rf = 112; rt = 115; }
      var r = b[rf]; b[rt] = r; b[rf] = 0; h ^= ZP[r + 6][rf] ^ ZP[r + 6][rt];
    }
    if (m.p === 6) this.wk = m.t; else if (m.p === -6) this.bk = m.t;
    h ^= ZC[this.castle]; this.castle &= CM[m.f] & CM[m.t]; h ^= ZC[this.castle];
    if (this.ep >= 0) h ^= ZE[this.ep];
    this.ep = (m.fl & 4) ? m.f + 16 * us : -1;
    if (this.ep >= 0) h ^= ZE[this.ep];
    this.half = (m.p * us === 1 || m.c) ? 0 : this.half + 1;
    if (us === -1) this.full++;
    this.side = -us; h ^= ZS; this.hash = h;
  };
