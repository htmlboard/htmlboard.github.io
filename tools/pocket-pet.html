<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="htmlboard-icon" content="🐣">
<meta name="color-scheme" content="dark">
<title>Pocket Pet</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23161111'/%3E%3Ccircle cx='16' cy='17' r='8' fill='%23f3d6c4'/%3E%3Ccircle cx='13' cy='16' r='1.2' fill='%23241a16'/%3E%3Ccircle cx='19' cy='16' r='1.2' fill='%23241a16'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #100e0c;
    --bg-elevated: #1c1916;
    --bg-subtle: #262220;
    --fg: #f4efe6;
    --fg-muted: #b7ab9e;
    --fg-subtle: #8a7e72;
    --border: rgba(244, 239, 230, 0.12);
    --border-strong: rgba(244, 239, 230, 0.22);
    --accent: #f4efe6;
    --accent-fg: #161311;
    --low: #9a5c52;
    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 16px;
    --radius-xl: 28px;
    --space-1: 4px;
    --space-2: 8px;
    --space-3: 12px;
    --space-4: 16px;
    --space-5: 24px;
    --space-6: 32px;
    --font-display: Palatino, "Palatino Linotype", Georgia, serif;
    --font-body: ui-rounded, "SF Pro Rounded", system-ui, sans-serif;
    --text-xs: 0.75rem;
    --text-sm: 0.875rem;
    --text-base: 1rem;
    --text-lg: 1.125rem;
    --text-xl: 1.75rem;
    --leading-tight: 1.1;
    --leading-snug: 1.25;
    --leading-normal: 1.45;
    --motion-quick: 150ms;
    --motion-fast: 250ms;
    --ease-smooth-out: cubic-bezier(0.22, 1, 0.36, 1);
    --shadow: 0 12px 40px rgba(0, 0, 0, 0.28);
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-body);
    font-size: var(--text-base);
    line-height: var(--leading-normal);
    -webkit-tap-highlight-color: transparent;
  }
  body {
    overflow: hidden;
    touch-action: manipulation;
  }
  button, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  button:focus-visible, input:focus-visible, textarea:focus-visible {
    outline: 2px solid var(--fg);
    outline-offset: 2px;
  }
  h1, p { margin: 0; }

  #app {
    height: 100%;
    min-height: 100vh;
    min-height: 100dvh;
    max-width: 440px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: var(--space-3);
    padding-top: calc(var(--space-3) + env(safe-area-inset-top));
    padding-right: max(var(--space-4), env(safe-area-inset-right));
    padding-bottom: calc(var(--space-3) + env(safe-area-inset-bottom));
    padding-left: max(24px, env(safe-area-inset-left));
    overflow: auto;
    overscroll-behavior: none;
  }
  @media (min-width: 800px) {
    #app { max-width: 520px; padding-top: calc(var(--space-6) + env(safe-area-inset-top)); }
  }

  header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: var(--space-3);
    min-height: 48px;
  }
  .who { min-width: 0; }
  .kicker {
    color: var(--fg-muted);
    font-size: var(--text-sm);
    font-weight: 500;
    line-height: var(--leading-snug);
  }
  h1 {
    font-family: var(--font-display);
    font-size: var(--text-xl);
    font-weight: 600;
    letter-spacing: -0.02em;
    line-height: var(--leading-tight);
    overflow-wrap: anywhere;
  }
  #menuBtn {
    flex: 0 0 auto;
    width: 48px;
    height: 48px;
    border: 1px solid var(--border);
    background: transparent;
    border-radius: var(--radius-md);
    display: grid;
    place-items: center;
    color: var(--fg);
  }
  #menuBtn:active { transform: scale(0.98); }

  .stage {
    position: relative;
    flex: 1 1 auto;
    min-height: 240px;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: var(--radius-xl);
    overflow: hidden;
  }
  .stage::before {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 50% 42%, rgba(244, 239, 230, 0.07), transparent 58%);
    pointer-events: none;
  }
  .stage.night::before {
    background: radial-gradient(ellipse at 50% 36%, rgba(213, 219, 227, 0.06), transparent 52%);
  }
  .stage.asleep::before { opacity: 0.35; }
  #view {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
  .say {
    position: absolute;
    left: var(--space-4);
    right: var(--space-4);
    top: var(--space-4);
    z-index: 5;
    pointer-events: none;
    color: var(--fg);
    font-size: var(--text-base);
    line-height: var(--leading-snug);
    text-shadow: 0 1px 0 rgba(0,0,0,0.35);
    max-width: 26ch;
  }
  .zzz {
    position: absolute;
    left: 62%;
    top: 22%;
    z-index: 4;
    pointer-events: none;
    color: var(--fg-muted);
    font-family: var(--font-display);
    font-size: 1.25rem;
  }
  .zzz span { display: inline-block; margin-right: 2px; animation: floatz 2.4s ease-in-out infinite; }
  .zzz span:nth-child(2) { animation-delay: 0.3s; font-size: 1rem; }
  .zzz span:nth-child(3) { animation-delay: 0.6s; font-size: 0.8rem; }
  @keyframes floatz {
    0% { transform: translateY(4px); opacity: 0.2; }
    40% { opacity: 1; }
    100% { transform: translateY(-16px); opacity: 0; }
  }

  .pet-hit {
    position: absolute;
    left: 50%;
    top: 48%;
    transform: translate(-50%, -50%);
    width: min(210px, 62%);
    height: min(230px, 56%);
    border: 0;
    background: transparent;
    border-radius: 46%;
    z-index: 2;
  }
  .stage.is-egg .pet-hit { width: min(240px, 70%); height: min(260px, 64%); }

  #poops, #flies, #fx { position: absolute; inset: 0; pointer-events: none; }
  .poop, .fly {
    position: absolute;
    width: 48px;
    height: 48px;
    border: 0;
    background: transparent;
    padding: 0;
    pointer-events: auto;
    touch-action: none;
  }
  .poop { z-index: 3; }
  .fly { z-index: 4; }
  .fly i {
    display: block;
    width: 8px;
    height: 8px;
    margin: 20px auto;
    background: var(--fg);
    box-shadow: 0 0 0 3px rgba(244, 239, 230, 0.18);
  }
  #fx { z-index: 6; }
  .spark {
    position: absolute;
    width: 4px;
    height: 4px;
    background: var(--fg);
    animation: rise 700ms var(--ease-smooth-out) forwards;
  }
  @keyframes rise {
    to { transform: translateY(-32px); opacity: 0; }
  }
  .stage.shake #view { animation: wob 420ms var(--ease-smooth-out); }
  @keyframes wob {
    0% { transform: translateX(0); }
    30% { transform: translateX(-5px) rotate(-1.5deg); }
    60% { transform: translateX(4px) rotate(1.5deg); }
    100% { transform: translateX(0); }
  }
  .stage.hatch::after {
    content: "";
    position: absolute;
    inset: 0;
    background: var(--fg);
    pointer-events: none;
    animation: flash 700ms var(--ease-smooth-out);
  }
  @keyframes flash {
    0% { opacity: 0.9; }
    100% { opacity: 0; }
  }

  .meters {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: var(--space-2) var(--space-4);
  }
  .meter-top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-size: var(--text-xs);
    color: var(--fg-muted);
    font-weight: 500;
    margin-bottom: 3px;
  }
  .meter em {
    font-style: normal;
    font-variant-numeric: tabular-nums;
    color: var(--fg);
  }
  .track {
    height: 6px;
    background: var(--bg-subtle);
    border-radius: 99px;
    overflow: hidden;
  }
  .track i {
    display: block;
    height: 100%;
    width: 0;
    background: var(--fg);
    border-radius: 99px;
  }
  .meter.low .track i { background: var(--low); }
  .meter.low em { color: var(--low); }
  .meter.wide { grid-column: 1 / -1; }

  .dock { display: flex; flex-direction: column; gap: var(--space-2); }
  .care {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: var(--space-2);
  }
  .care button, .btn, .btn-primary {
    min-height: 52px;
    border-radius: var(--radius-md);
    border: 1px solid var(--border);
    background: var(--bg-subtle);
    color: var(--fg);
    font-size: var(--text-sm);
    font-weight: 600;
    padding: 0 var(--space-2);
  }
  .care button:active, .btn:active, .btn-primary:active { transform: scale(0.98); }
  .btn, .btn-primary { width: 100%; padding: 0 var(--space-4); }
  .btn-primary {
    background: var(--accent);
    color: var(--accent-fg);
    border-color: transparent;
  }
  .btn.quiet { background: transparent; color: var(--fg-muted); }
  .dots {
    display: flex;
    gap: 6px;
    justify-content: center;
    padding-bottom: 2px;
  }
  .dots i {
    width: 8px;
    height: 8px;
    border-radius: 99px;
    background: var(--bg-subtle);
    border: 1px solid var(--border-strong);
  }
  .dots i.on { background: var(--fg); border-color: var(--fg); }
  .play-meta {
    text-align: center;
    color: var(--fg-muted);
    font-variant-numeric: tabular-nums;
    font-size: var(--text-sm);
  }

  .scrim {
    position: fixed;
    inset: 0;
    z-index: 20;
    background: rgba(0, 0, 0, 0.52);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding-top: env(safe-area-inset-top);
    padding-right: max(var(--space-4), env(safe-area-inset-right));
    padding-left: max(24px, env(safe-area-inset-left));
    opacity: 0;
    pointer-events: none;
    transition: opacity var(--motion-fast) var(--ease-smooth-out);
  }
  .scrim.open { opacity: 1; pointer-events: auto; }
  .sheet {
    width: min(440px, 100%);
    max-height: min(78dvh, 680px);
    overflow: auto;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-bottom: 0;
    border-radius: var(--radius-xl) var(--radius-xl) 0 0;
    padding: var(--space-4);
    padding-bottom: calc(var(--space-4) + env(safe-area-inset-bottom));
    box-shadow: var(--shadow);
    transform: translateY(12px);
    opacity: 0;
    transition: transform var(--motion-fast) var(--ease-smooth-out), opacity var(--motion-fast) var(--ease-smooth-out);
  }
  .scrim.open .sheet { transform: none; opacity: 1; }
  .sheet h2 {
    font-family: var(--font-display);
    font-size: var(--text-lg);
    font-weight: 600;
    letter-spacing: -0.02em;
    margin: 0 0 var(--space-1);
  }
  .sheet .sub { color: var(--fg-muted); font-size: var(--text-sm); margin-bottom: var(--space-4); }
  .stack { display: flex; flex-direction: column; gap: var(--space-2); }
  .sheet .stack { margin-top: 12px; }
  .sheet .field + .btn { margin-top: 8px; }
  .rowline {
    display: flex;
    justify-content: space-between;
    gap: var(--space-3);
    padding: var(--space-2) 0;
    border-top: 1px solid var(--border);
    font-size: var(--text-sm);
  }
  .rowline span { color: var(--fg-muted); }
  .journal { list-style: none; margin: 0; padding: 0; }
  .journal li {
    padding: var(--space-2) 0;
    border-top: 1px solid var(--border);
    font-size: var(--text-sm);
  }
  .journal time { display: block; color: var(--fg-subtle); font-size: var(--text-xs); }
  label.field { display: flex; flex-direction: column; gap: 6px; font-size: var(--text-sm); color: var(--fg-muted); }
  input[type="text"], textarea {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-md);
    padding: 12px 14px;
    font-size: 16px;
    min-height: 48px;
  }
  textarea { min-height: 88px; resize: vertical; }
  .section-label {
    margin: var(--space-4) 0 var(--space-2);
    color: var(--fg-subtle);
    font-size: var(--text-xs);
    font-weight: 600;
  }
  @media (max-height: 560px) {
    .stage { min-height: 160px; }
    h1 { font-size: 1.35rem; }
    .care button { min-height: 48px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation: none !important;
      transition: none !important;
    }
    .spark { display: none; }
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="who">
      <p id="kicker" class="kicker">Pocket Pet</p>
      <h1 id="title">An egg</h1>
    </div>
    <button type="button" id="menuBtn" aria-label="Menu">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
        <path d="M5 7h14M5 12h14M5 17h14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
    </button>
  </header>

  <div id="stage" class="stage is-egg">
    <canvas id="view" width="48" height="52" aria-hidden="true"></canvas>
    <p id="say" class="say" aria-live="polite"></p>
    <div id="zzz" class="zzz" hidden aria-hidden="true"><span>z</span><span>z</span><span>z</span></div>
    <button type="button" id="petHit" class="pet-hit" aria-label="Warm the egg"></button>
    <div id="poops"></div>
    <div id="flies"></div>
    <div id="fx"></div>
  </div>

  <div id="meters" class="meters" hidden>
    <div class="meter" id="m-fullness"><div class="meter-top"><span>Full</span><em id="n-fullness">0</em></div><div class="track"><i id="b-fullness"></i></div></div>
    <div class="meter" id="m-joy"><div class="meter-top"><span>Joy</span><em id="n-joy">0</em></div><div class="track"><i id="b-joy"></i></div></div>
    <div class="meter" id="m-rest"><div class="meter-top"><span>Rest</span><em id="n-rest">0</em></div><div class="track"><i id="b-rest"></i></div></div>
    <div class="meter" id="m-fresh"><div class="meter-top"><span>Fresh</span><em id="n-fresh">0</em></div><div class="track"><i id="b-fresh"></i></div></div>
    <div class="meter wide" id="m-health"><div class="meter-top"><span>Health</span><em id="n-health">0</em></div><div class="track"><i id="b-health"></i></div></div>
  </div>

  <div class="dock" id="dock">
    <div id="eggDots" class="dots"></div>
    <button type="button" id="warmBtn" class="btn-primary">Warm the egg</button>
    <button type="button" id="medBtn" class="btn-primary" hidden>Give medicine</button>
    <div id="careRow" class="care" hidden>
      <button type="button" id="feedBtn">Feed</button>
      <button type="button" id="playBtn">Play</button>
      <button type="button" id="washBtn">Wash</button>
      <button type="button" id="restBtn">Rest</button>
    </div>
    <button type="button" id="againBtn" class="btn-primary" hidden>Begin again</button>
    <div id="playRow" hidden>
      <p id="playMeta" class="play-meta"></p>
      <button type="button" id="enoughBtn" class="btn">Enough</button>
    </div>
  </div>
</div>

<div id="scrim" class="scrim" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div id="sheetBody"></div>
  </div>
</div>

<script>
'use strict';
(function () {
  var KEY = 'pocket-pet';
  var MAX_AWAY = 36 * 60 * 60 * 1000;
  var STAGE_MIN = [0, 8, 45, 180];
  var STAGE_NAME = ['Baby', 'Child', 'Teen', 'Adult'];
  var NAMES = ['Mochi','Pebble','Nori','Bramble','Pip','Juniper','Dot','Cinder','Plum','Wick','Sable','Pollen','Marble','Button','Fig','Lark','Moss','Biscuit','Nutmeg','Quill'];
  var SPECIES = {
    puff: { name: 'Puff', blurb: 'Even-tempered and round.', body:[243,214,196], belly:[255,244,232], shade:[214,170,150], shine:[255,236,224], blush:[216,132,128], accent:[230,170,160], accent2:[196,120,116], foot:[186,146,128], speck:[110,74,64] },
    nib:  { name: 'Nib',  blurb: 'Motivated mostly by food.', body:[240,196,150], belly:[255,236,210], shade:[214,156,110], shine:[255,244,228], blush:[214,124,104], accent:[214,150,100], accent2:[160,96,64], foot:[176,124,90], speck:[92,62,40] },
    zip:  { name: 'Zip',  blurb: 'Restless, and fond of lights.', body:[232,164,106], belly:[255,228,196], shade:[196,120,72], shine:[255,236,214], blush:[210,112,96], accent:[244,196,140], accent2:[196,110,78], foot:[168,104,66], speck:[80,50,36] },
    luma: { name: 'Luma', blurb: 'Prefers the lamp and a long rest.', body:[214,220,226], belly:[236,240,242], shade:[168,180,190], shine:[248,250,252], blush:[176,160,170], accent:[186,198,208], accent2:[120,136,150], foot:[150,160,170], speck:[70,80,90] },
    dew:  { name: 'Dew',  blurb: 'Happiest when things are clean.', body:[214,224,200], belly:[238,244,230], shade:[168,184,150], shine:[246,252,242], blush:[206,136,136], accent:[120,168,120], accent2:[72,120,78], foot:[140,158,124], speck:[70,90,60] }
  };
  var IDLE = {
    baby: ['Oh.', 'Hello.', 'You stayed.'],
    puff: ['This is a good spot.', 'The light is warm.', 'I am right here.'],
    nib: ['I smell something.', 'A berry would be nice.', 'Still thinking about lunch.'],
    zip: ['Was that a light?', 'I can sit. For a moment.', 'Again?'],
    luma: ['No hurry.', 'The quiet is fine.', 'The lamp is enough.'],
    dew: ['All tidy, for now.', 'I like clean ground.', 'Soft day.']
  };

  var save = null;
  var actx = null;
  var play = null;
  var flySeq = 1;
  var sayLock = '';
  var sayUntil = 0;
  var idleI = 0;
  var idleAt = 0;
  var dockKey = '';
  var exprUntil = 0;
  var exprKind = '';
  var booting = true;
  var lastPersist = 0;
  var lastFrame = 0;
  var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var sheetClose = null;
  var poopPos = [];
  var night = false;

  var kickerEl = document.getElementById('kicker');
  var titleEl = document.getElementById('title');
  var stageEl = document.getElementById('stage');
  var view = document.getElementById('view');
  var ctx = view.getContext('2d');
  var sayEl = document.getElementById('say');
  var zzzEl = document.getElementById('zzz');
  var petHit = document.getElementById('petHit');
  var poopsEl = document.getElementById('poops');
  var fliesEl = document.getElementById('flies');
  var fxEl = document.getElementById('fx');
  var metersEl = document.getElementById('meters');
  var eggDots = document.getElementById('eggDots');
  var warmBtn = document.getElementById('warmBtn');
  var medBtn = document.getElementById('medBtn');
  var careRow = document.getElementById('careRow');
  var feedBtn = document.getElementById('feedBtn');
  var playBtn = document.getElementById('playBtn');
  var washBtn = document.getElementById('washBtn');
  var restBtn = document.getElementById('restBtn');
  var againBtn = document.getElementById('againBtn');
  var playRow = document.getElementById('playRow');
  var playMeta = document.getElementById('playMeta');
  var enoughBtn = document.getElementById('enoughBtn');
  var menuBtn = document.getElementById('menuBtn');
  var scrim = document.getElementById('scrim');
  var sheetBody = document.getElementById('sheetBody');
  var off = document.createElement('canvas');
  off.width = 48;
  off.height = 52;
  var octx = off.getContext('2d', { willReadFrequently: true });

  function clamp(n, a, b) {
    if (a == null) a = 0;
    if (b == null) b = 100;
    if (!isFinite(n)) n = a;
    return Math.max(a, Math.min(b, n));
  }
  function num(n, d) { return typeof n === 'number' && isFinite(n) ? n : d; }
  function pet() { return save && save.pet; }
  function pickName() { return NAMES[Math.floor(Math.random() * NAMES.length)]; }
  function cleanName(s) {
    var t = String(s || '').replace(/\s+/g, ' ').trim().slice(0, 12);
    return t || pickName();
  }
  function nowMs() { return Date.now(); }

  function freshEgg() {
    return {
      phase: 'egg',
      name: '',
      taps: 0,
      born: 0,
      lastTick: nowMs(),
      goneAt: 0,
      cause: '',
      stage: 0,
      species: 'puff',
      speciesLocked: false,
      generation: save.nextGen || 1,
      fullness: 72,
      joy: 76,
      rest: 84,
      fresh: 92,
      health: 100,
      heft: 16,
      poops: 0,
      poopMeter: 0,
      asleep: false,
      sick: false,
      traits: { nib: 0, zip: 0, luma: 0, dew: 0 },
      care: 0,
      nextNuzzle: 0,
      flags: {},
      journal: []
    };
  }

  function defaultSave() {
    return { v: 1, settings: { sound: true }, nextGen: 1, memorial: [], pet: null };
  }

  function sanitizePet(p) {
    if (!p || typeof p !== 'object') return freshEgg();
    var phase = p.phase === 'alive' || p.phase === 'gone' || p.phase === 'egg' ? p.phase : 'egg';
    var traits = p.traits || {};
    var flags = p.flags || {};
    return {
      phase: phase,
      name: String(p.name || '').slice(0, 12),
      taps: clamp(num(p.taps, 0), 0, 8),
      born: num(p.born, 0),
      lastTick: num(p.lastTick, nowMs()),
      goneAt: num(p.goneAt, 0),

      species: SPECIES[p.species] ? p.species : 'puff',
      speciesLocked: !!p.speciesLocked,
      generation: clamp(num(p.generation, 1), 1, 9999),
      fullness: clamp(num(p.fullness, 70)),
      joy: clamp(num(p.joy, 70)),
      rest: clamp(num(p.rest, 80)),
      fresh: clamp(num(p.fresh, 90)),
      health: clamp(num(p.health, 100)),
      heft: clamp(num(p.heft, 16), 8, 72),
      poops: clamp(Math.round(num(p.poops, 0)), 0, 3),
      poopMeter: clamp(num(p.poopMeter, 0), 0, 80),
      asleep: !!p.asleep,
      sick: !!p.sick,
      traits: {

        zip: num(traits.zip, 0),
        luma: num(traits.luma, 0),
        dew: num(traits.dew, 0)

      care: Math.max(0, Math.round(num(p.care, 0))),
      nextNuzzle: num(p.nextNuzzle, 0),
      flags: {

      journal: Array.isArray(p.journal) ? p.journal.slice(0, 50).filter(function (e) {
        return e && typeof e.msg === 'string';
      }).map(function (e) { return { t: num(e.t, nowMs()), msg: String(e.msg).slice(0, 140) }; }) : []
    };
  }

  function load() {
    var raw = null;
    try { raw = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { raw = null; }
    save = defaultSave();
    if (raw && typeof raw === 'object') {
      save.settings.sound = !raw.settings || raw.settings.sound !== false;
      save.nextGen = clamp(num(raw.nextGen, 1), 1, 9999);
      save.memorial = Array.isArray(raw.memorial) ? raw.memorial.slice(-30) : [];
      if (raw.pet) save.pet = sanitizePet(raw.pet);
    }
    if (!save.pet) save.pet = freshEgg();
    for (var i = 0; i < 8; i++) {
      var dot = document.createElement('i');
      eggDots.appendChild(dot);
    }
  }

  var saveTimer = 0;
  function persist() {
    try { localStorage.setItem(KEY, JSON.stringify(save)); } catch (e) {}
  }

  }

  function journal(msg) {
    var p = pet();
    if (!p) return;
    p.journal.unshift({ t: nowMs(), msg: msg });
    if (p.journal.length > 40) p.journal.length = 40;
    markDirty();
  }

  function ageMs(p, now) {
    if (!p || !p.born) return 0;
    var end = p.phase === 'gone' ? (p.goneAt || now) : now;
    return Math.max(0, end - p.born);
  }
  function stageIndex(ms) {
    var m = ms / 60000;

    if (m >= STAGE_MIN[2]) return 2;
    if (m >= STAGE_MIN[1]) return 1;
    return 0;
  }
  function formatAge(ms) {
    var m = Math.floor(ms / 60000);
    if (m < 1) return 'just hatched';
    if (m < 60) return m + 'm';
    var h = Math.floor(m / 60);
    if (h < 48) return (m % 60) ? (h + 'h ' + (m % 60) + 'm') : (h + 'h');

  }

    min = Math.round(min);

    var h = Math.floor(min / 60);
    var m = min % 60;

    return Math.floor(h / 24) + 'd ' + (h % 24) + 'h';
  }

  function decideSpecies(traits) {

      var v = traits[keys[i]] || 0;
      if (v > bestV) { best = keys[i]; bestV = v; tie = false; }
      else if (best && v === bestV) tie = true;
    }
    if (!best || tie) return 'puff';
    return best;
  }

  function passOn(cause) {
    var p = pet();
    if (!p || p.phase === 'gone' || p.phase === 'egg') return;
    p.phase = 'gone';
    p.asleep = false;
    p.goneAt = nowMs();
    p.cause = cause;
    if (play) cancelPlay();
    var sp = p.speciesLocked ? SPECIES[p.species].name : 'unformed';
    save.memorial.push({
      name: p.name || 'Pet',
      species: sp,
      stage: STAGE_NAME[p.stage] || 'Baby',
      age: formatAge(ageMs(p, p.goneAt)),
      generation: p.generation,
      cause: cause,
      gone: p.goneAt
    });
    if (save.memorial.length > 30) save.memorial.splice(0, save.memorial.length - 30);
    save.nextGen = (p.generation || 1) + 1;
    journal(cause === 'goodbye' ? 'Went to the meadow.' : 'Faded, and went to the meadow.');

  }

  function updateGrowth(now) {
    var p = pet();
    if (!p || p.phase !== 'alive' || !p.born) return;
    var next = stageIndex(ageMs(p, now));
    if (next === p.stage) return;
    for (var s = p.stage + 1; s <= next; s++) {
      if (s >= 2 && !p.speciesLocked) {

        p.speciesLocked = true;
        journal('Turned out to be a ' + SPECIES[p.species].name + '.');
      }
      journal('Grew into ' + (/^[aeiou]/i.test(STAGE_NAME[s]) ? 'an ' : 'a ') + STAGE_NAME[s].toLowerCase() + '.');
    }
    p.stage = next;
    if (!reduced) {
      stageEl.classList.add('hatch');
      setTimeout(function () { stageEl.classList.remove('hatch'); }, 720);
    }
    markDirty();
  }

  function snapshot(p) {
    return {
      fullness: p.fullness, joy: p.joy, rest: p.rest, fresh: p.fresh, health: p.health,
      poops: p.poops, sick: p.sick, stage: p.stage, phase: p.phase

  }

  function tick(mult) {
    var p = pet();
    if (!p || p.phase !== 'alive') return;
    var asleep = p.asleep;
    p.fullness -= 0.12 * mult;
    p.joy -= (asleep ? 0.04 : 0.085) * mult;
    if (asleep) p.rest += 0.7 * mult;
    else p.rest -= 0.13 * mult * (p.heft > 55 ? 1.25 : 1);
    p.fresh -= (0.07 + p.poops * 0.045) * mult;
    if (!asleep) {
      p.poopMeter += mult;
      if (p.poopMeter >= 55 && p.poops < 3) {
        p.poops += 1;
        p.poopMeter = 0;
        journal('Left a mess.');
      }
    } else {
      p.poopMeter += mult * 0.25;
    }
    var dmg = 0;
    if (p.fullness < 18) dmg += 0.28;
    if (p.joy < 12) dmg += 0.12;
    if (p.fresh < 18) dmg += 0.18;
    if (p.rest < 10 && !asleep) dmg += 0.1;
    if (p.sick) dmg += 0.35;
    if (dmg === 0 && p.fullness > 35 && p.fresh > 35 && p.joy > 25) p.health += 0.2 * mult;
    else p.health -= dmg * mult;

    if (!p.sick && p.health < 48 && (p.fullness < 16 || p.fresh < 14 || p.health < 32)) {
      p.sick = true;
      journal('Got sick.');
      if (!document.hidden) tone(150, 0.18, 'triangle', 0.03);
    }
    if (p.rest <= 0 && !asleep && !p.flags.collapsed) {
      p.asleep = true;
      p.flags.collapsed = true;
      journal('Fell asleep standing up.');
    }
    if (p.rest > 25) p.flags.collapsed = false;
    if (asleep && p.rest >= 100) p.asleep = false;
    if (asleep && p.fullness < 12 && p.rest > 30) {
      p.asleep = false;
      journal('Woke up hungry.');
    }
    p.fullness = clamp(p.fullness);
    p.joy = clamp(p.joy);
    p.rest = clamp(p.rest);
    p.fresh = clamp(p.fresh);
    p.health = clamp(p.health);
    p.heft = clamp(p.heft, 8, 72);
    p.poops = clamp(p.poops, 0, 3);
    noteFlag('hungry', p.fullness < 22, p.fullness > 40);
    noteFlag('lonely', p.joy < 22, p.joy > 40);
    noteFlag('sleepy', p.rest < 18 && !p.asleep, p.rest > 40);
    noteFlag('dirty', p.fresh < 22 || p.poops > 0, p.fresh > 45 && p.poops === 0);

  }

  function noteFlag(key, on, off) {
    var p = pet();
    if (!p.flags) p.flags = {};

      p.flags[key] = true;
      if (!document.hidden && save.settings.sound) tone(180, 0.12, 'sine', 0.025);
    } else if (off && p.flags[key]) p.flags[key] = false;
  }

  function simulate(now) {
    var p = pet();
    if (!p) return null;
    if (p.phase !== 'alive') {
      if (p.phase === 'egg') p.lastTick = now;
      return null;
    }
    var ms = now - p.lastTick;
    if (ms < 0) ms = 0;
    var capped = ms > MAX_AWAY;
    if (capped) ms = MAX_AWAY;
    var before = snapshot(p);
    var minutes = ms / 60000;
    var whole = Math.floor(minutes);
    var frac = minutes - whole;
    for (var i = 0; i < whole; i++) {
      tick(1);
      if (pet().phase !== 'alive') break;
    }
    if (pet().phase === 'alive' && frac > 0.00001) tick(frac);
    if (pet().phase === 'alive') updateGrowth(now);
    p = pet();
    p.lastTick = now;
    return {
      minutes: minutes,
      capped: capped,
      before: before,
      after: snapshot(p)
    };
  }

  function meaningful(report) {
    if (!report || report.minutes < 5) return false;
    if (pet().phase !== 'alive') return false;
    var keys = ['fullness', 'joy', 'rest', 'fresh', 'health'];
    for (var i = 0; i < keys.length; i++) {
      if (Math.abs(report.before[keys[i]] - report.after[keys[i]]) >= 3) return true;
    }
    if (report.before.poops !== report.after.poops) return true;
    if (report.before.sick !== report.after.sick) return true;
    if (report.before.stage !== report.after.stage) return true;
    return false;
  }

  function grid(w, h) {
    var g = new Array(h);

  }

  function drawPetGrid(species, stage, expr, wag, heft, dirty) {
    var g = grid(48, 52);
    var sc = [0.78, 0.9, 1.02, 1.14][stage] || 1;
    var wide = species === 'nib' ? 1.14 : species === 'zip' ? 0.98 : 1;
    var hx = 25;
    var hy = 24;
    var headRx = (10.1 + heft * 0.04) * sc * wide;
    var headRy = (9.3 - heft * 0.015) * sc * (species === 'nib' ? 0.9 : 1);
    if (species === 'luma' && stage >= 1) {
      ellipse(g, hx - headRx * 0.95, hy - 2, 5.1 * sc, 2.5 * sc, 9);
      ellipse(g, hx + headRx * 0.95, hy - 2, 5.1 * sc, 2.5 * sc, 9);
      ellipse(g, hx - headRx * 0.8, hy + 2.2, 3.5 * sc, 1.7 * sc, 10);
      ellipse(g, hx + headRx * 0.8, hy + 2.2, 3.5 * sc, 1.7 * sc, 10);
    }
    if (species === 'puff' || species === 'zip') {
      var tx = hx - headRx - 0.2 + wag * 1.6;
      var ty = hy + headRy * 0.42;
      ellipse(g, tx, ty, 3.3 * sc, 2.7 * sc, 2);
      ellipse(g, tx + 0.6, ty + 0.8, 1.8 * sc, 1.4 * sc, 4);
    }
    var bodyY = hy + headRy * 0.78;
    var bodyRx = headRx * (species === 'nib' ? 0.78 : 0.62);
    var bodyRy = 5.4 * sc;
    var footY = bodyY + bodyRy * 0.55;
    ellipse(g, hx - bodyRx * 0.45, footY + 2, 2.2 * sc, 1.45 * sc, 13);
    ellipse(g, hx + bodyRx * 0.45, footY + 2, 2.2 * sc, 1.45 * sc, 13);
    if (species !== 'nib' && species !== 'luma' && species !== 'dew') {
      var earH = (species === 'zip' ? 9.2 : 6.4) * sc;
      var earW = (species === 'zip' ? 3.15 : 3.5) * sc;
      var earBase = hy - headRy + 3;
      var spread = headRx * 0.62;
      triEar(g, hx - spread, earBase - earH, earBase + 1, earW, 9, 10);
      triEar(g, hx + spread, earBase - earH, earBase + 1, earW, 9, 10);
    }
    if (species === 'luma') {
      var top = hy - headRy - 5.5 * sc;
      var i;
      for (i = 0; i < 5.5 * sc; i++) {
        plot(g, hx - 3.2, top + i, 9);
        plot(g, hx + 3.2, top + i, 9);
      }
      ellipse(g, hx - 3.2, top, 1.25, 1.25, 10);
      ellipse(g, hx + 3.2, top, 1.25, 1.25, 10);
    }
    if (species === 'dew') {
      var leafH = Math.round(5 * sc);
      var lx = hx + 1;
      var ly = hy - headRy + 1;
      for (i = 0; i < leafH; i++) plot(g, lx, ly - i, 10);
      plot(g, lx - 1, ly - leafH + 2, 9);
      plot(g, lx + 1, ly - leafH + 2, 9);
      plot(g, lx - 1, ly - leafH + 3, 9);
      plot(g, lx + 1, ly - leafH + 3, 9);
      plot(g, lx, ly - leafH, 9);
      plot(g, lx, ly - leafH + 1, 9);
    }
    ellipse(g, hx, bodyY, bodyRx, bodyRy, 2);
    ellipse(g, hx, hy, headRx, headRy, 2);
    ellipse(g, hx, hy + headRy * 0.42, headRx * 0.78, headRy * 0.36, 4);
    ellipse(g, hx, hy - headRy * 0.08, headRx * 0.7, headRy * 0.55, 2);
    plot(g, hx - headRx * 0.34, hy - headRy * 0.4, 5);
    plot(g, hx - headRx * 0.34 + 1, hy - headRy * 0.4, 5);
    ellipse(g, hx, hy + headRy * 0.58, headRx * 0.38, headRy * 0.24, 3);
    var blushY = hy + headRy * 0.22;
    ellipse(g, hx - headRx * 0.46, blushY, 1.65 * sc, 1.05 * sc, 8);
    ellipse(g, hx + headRx * 0.46, blushY, 1.65 * sc, 1.05 * sc, 8);
    if (species === 'nib') {
      var seeds = [[-4, -5], [4, -3], [1, -6], [-5, 0], [5, 2]];
      for (i = 0; i < seeds.length; i++) ellipse(g, hx + seeds[i][0] * sc, hy + seeds[i][1] * sc * 0.75, 0.7, 0.7, 12);
    }
    if (dirty) {
      ellipse(g, hx - 4, hy + 5, 0.7, 0.7, 12);
      ellipse(g, hx + 5, hy + 2, 0.65, 0.65, 12);
      ellipse(g, hx + 1, hy + headRy * 0.7, 0.7, 0.7, 12);
    }
    var eyeY = hy + 0.2;
    var eyeDX = headRx * 0.33;
    var eyeR = Math.max(1.55, 2.05 * sc);
    var s;
    if (expr === 'happy' || expr === 'sleep') {
      for (s = -1; s <= 1; s += 2) {
        var ex = hx + s * eyeDX;
        if (expr === 'happy') {
          plot(g, ex - 2, eyeY + 1, 11);
          plot(g, ex - 1, eyeY, 11);
          plot(g, ex, eyeY, 11);
          plot(g, ex + 1, eyeY, 11);
          plot(g, ex + 2, eyeY + 1, 11);
        } else {
          for (i = -2; i <= 2; i++) plot(g, ex + i, eyeY, 11);
        }
      }
    } else if (expr === 'blink') {
      for (s = -1; s <= 1; s += 2) {
        for (i = -2; i <= 2; i++) plot(g, hx + s * eyeDX + i, eyeY, 11);
      }
    } else {
      for (s = -1; s <= 1; s += 2) {
        ex = hx + s * eyeDX;
        ellipse(g, ex, eyeY, eyeR, eyeR * (expr === 'sick' ? 0.62 : 1.05), 6);
        ellipse(g, ex + 0.35, eyeY + 0.45, Math.max(0.75, eyeR * 0.4), Math.max(0.75, eyeR * 0.46), 7);
        plot(g, ex - 0.6, eyeY - 0.7, 5);
      }
    }
    var my = hy + headRy * 0.4;
    if (expr === 'eat') {
      ellipse(g, hx, my + 0.5, 2.2 * sc, 1.7 * sc, 11);
      ellipse(g, hx, my + 1.1, 1.15 * sc, 0.7 * sc, 8);
    } else if (expr === 'sick' || expr === 'sleep') {
      for (i = -1; i <= 1; i++) plot(g, hx + i, my, 11);
    } else if (expr === 'happy') {
      plot(g, hx - 2, my, 11);
      plot(g, hx - 1, my + 1, 11);
      plot(g, hx, my + 1, 11);
      plot(g, hx + 1, my + 1, 11);
      plot(g, hx + 2, my, 11);
    } else {
      plot(g, hx - 2, my, 11);
      plot(g, hx - 1, my + 1, 11);
      plot(g, hx, my + 1, 11);
      plot(g, hx + 1, my + 1, 11);
      plot(g, hx + 2, my, 11);
    }
    if (expr === 'sick') {
      plot(g, hx + headRx * 0.78, hy - 4, 5);
      plot(g, hx + headRx * 0.78, hy - 3, 5);
      plot(g, hx + headRx * 0.78, hy - 2, 5);
      plot(g, hx + headRx * 0.78 + 1, hy - 1, 5);
    }
    return addOutline(g);
  }

  function drawEggGrid(cracks) {
    var g = grid(48, 52);
    ellipse(g, 24, 27, 12, 15.2, 2);
    ellipse(g, 19, 20, 3.4, 2.1, 5);
    ellipse(g, 31, 32, 1.5, 1.2, 4);
    ellipse(g, 17, 34, 1.2, 1.5, 4);
    ellipse(g, 28, 24, 1.1, 0.9, 4);
    var c = addOutline(g);
    var lines = [
      [[24, 18], [22, 22], [25, 25]],
      [[27, 20], [30, 24], [28, 28]],
      [[18, 30], [16, 34], [19, 37]],
      [[25, 32], [29, 36], [27, 40]]
    ];
    var n = Math.min(cracks, lines.length);
    for (var i = 0; i < n; i++) {
      var pts = lines[i];
      for (var p = 0; p < pts.length - 1; p++) {
        for (var s = 0; s <= 6; s++) {
          var x = pts[p][0] + (pts[p + 1][0] - pts[p][0]) * s / 6;
          var y = pts[p][1] + (pts[p + 1][1] - pts[p][1]) * s / 6;
          plot(c, x, y, 1);
        }
      }
    }
    return c;
  }

  function paintGrid(g, species) {
    var pal = SPECIES[species] || SPECIES.puff;
    var map = {
      2: pal.body, 3: pal.belly, 4: pal.shade, 5: pal.shine,
      8: pal.blush, 9: pal.accent, 10: pal.accent2, 12: pal.speck, 13: pal.foot
    };
    var img = octx.createImageData(48, 52);
    var d = img.data;
    for (var y = 0; y < 52; y++) {
      for (var x = 0; x < 48; x++) {
        var v = g[y][x];
        var i = (y * 48 + x) * 4;
        if (!v) { d[i + 3] = 0; continue; }
        var rgb = v === 1 ? [42, 32, 28] : v === 6 ? [255, 252, 248] : v === 7 ? [36, 26, 24] : v === 11 ? [62, 40, 38] : (map[v] || [255, 0, 0]);
        d[i] = rgb[0]; d[i + 1] = rgb[1]; d[i + 2] = rgb[2]; d[i + 3] = 255;
      }
    }
    octx.putImageData(img, 0, 0);
  }

  function expression(p) {
    var t = performance.now();
    if (exprUntil && t < exprUntil) return exprKind;
    if (!p || p.phase === 'egg') return 'egg';
    if (p.phase === 'gone') return 'sleep';
    if (p.asleep) return 'sleep';
    if (p.sick) return 'sick';
    if (p.joy > 82 && p.fullness > 40) return 'happy';
    var blinkAt = Math.floor(t / 2800);
    var into = t % 2800;

    return 'normal';
  }

      else if (best && v === bestV) tie = true;
    }
    if (!best || tie) return 'No strong leaning yet. They may stay a Puff.';
    return 'Leaning toward ' + SPECIES[best].name + '.';
  }

  function heftWord(n) {
    if (n < 18) return 'Light';
    if (n < 32) return 'Soft';
    if (n < 48) return 'Sturdy';
    if (n < 60) return 'Round';
    return 'Heavy';
  }

  function line(label, value) {
    var d = document.createElement('div');
    d.className = 'rowline';
    var s = document.createElement('span');
    s.textContent = label;
    var b = document.createElement('b');
    b.textContent = value;
    d.appendChild(s);
    d.appendChild(b);
    return d;
  }

  function openMenu() {
    var p = pet();
    openSheet(function (root) {
      root.appendChild(h2('Care'));
      var soundRow = document.createElement('div');
      soundRow.className = 'stack';
      soundRow.appendChild(button(save.settings.sound ? 'Turn sound off' : 'Turn sound on', 'btn', function () {
        save.settings.sound = !save.settings.sound;
        persist();
        closeSheet();
        if (save.settings.sound) { unlock(); tone(520, 0.06, 'sine', 0.03); }
      }));
      root.appendChild(soundRow);

      if (p && p.phase !== 'egg') {
        var label = document.createElement('p');
        label.className = 'section-label';
        label.textContent = 'This one';
        root.appendChild(label);
        root.appendChild(line('Generation', String(p.generation)));
        root.appendChild(line('Heft', heftWord(p.heft) + ' (' + Math.round(p.heft) + ')'));
        root.appendChild(line('Care given', String(p.care)));
        if (p.born) {
          var born = new Date(p.born);
          root.appendChild(line('Hatched', born.toLocaleDateString()));
        }
        var lean = document.createElement('p');
        lean.className = 'sub';
        lean.style.marginTop = '8px';
        lean.textContent = leaningText(p);
        root.appendChild(lean);

        var rename = document.createElement('label');
        rename.className = 'field';
        rename.textContent = 'Rename';
        var input = document.createElement('input');
        input.type = 'text';
        input.maxLength = 12;
        input.value = p.name || '';
        input.setAttribute('aria-label', 'Rename');
        rename.appendChild(input);
        root.appendChild(rename);
        root.appendChild(button('Save name', 'btn', function () {
          if (p.phase === 'egg') return;
          p.name = cleanName(input.value);
          journal('Now called ' + p.name + '.');
          persist();
          closeSheet();
        }));
      }

      var jl = document.createElement('p');
      jl.className = 'section-label';
      jl.textContent = 'Journal';
      root.appendChild(jl);
      var ul = document.createElement('ul');
      ul.className = 'journal';
      var entries = (p && p.journal) ? p.journal.slice(0, 12) : [];
      if (!entries.length) {
        var empty = document.createElement('li');
        empty.textContent = 'Nothing written yet.';
        ul.appendChild(empty);
      }
      entries.forEach(function (e) {
        var li = document.createElement('li');
        var time = document.createElement('time');
        time.textContent = new Date(e.t).toLocaleString();
        li.appendChild(time);
        li.appendChild(document.createTextNode(e.msg));
        ul.appendChild(li);
      });
      root.appendChild(ul);

      if (save.memorial.length) {
        var ml = document.createElement('p');
        ml.className = 'section-label';
        ml.textContent = 'Meadow';
        root.appendChild(ml);
        var mul = document.createElement('ul');
        mul.className = 'journal';
        save.memorial.slice().reverse().forEach(function (m) {
          var li = document.createElement('li');
          li.textContent = (m.name || 'Pet') + ' · ' + (m.species || '') + ' · ' + (m.age || '') + ' · gen ' + (m.generation || '');
          mul.appendChild(li);
        });
        root.appendChild(mul);
      }

      var bl = document.createElement('p');
      bl.className = 'section-label';
      bl.textContent = 'Backup';
      root.appendChild(bl);
      var paste = document.createElement('label');
      paste.className = 'field';
      paste.textContent = 'Paste a backup';
      var area = document.createElement('textarea');
      area.setAttribute('aria-label', 'Paste a backup');
      paste.appendChild(area);
      root.appendChild(paste);
      var file = document.createElement('input');
      file.type = 'file';
      file.accept = 'application/json,.json,text/plain';
      file.style.margin = '8px 0';
      file.setAttribute('aria-label', 'Import backup file');
      root.appendChild(file);
      var actions = document.createElement('div');
      actions.className = 'stack';
      actions.appendChild(button('Download backup', 'btn', exportFile));
      actions.appendChild(button('Copy backup', 'btn', copyBackup));
      actions.appendChild(button('Replace with backup', 'btn', function () {
        if (area.value.trim()) importText(area.value);
        else if (file.files && file.files[0]) {
          var reader = new FileReader();
          reader.onload = function () { importText(String(reader.result || '')); };
          reader.readAsText(file.files[0]);
        } else speak('Nothing to import.', 1600);
      }));
      if (p && p.phase === 'alive') {
        actions.appendChild(button('Say goodbye', 'btn quiet', function () {
          closeSheet();
          setTimeout(openGoodbye, reduced ? 0 : 200);
        }));
      }
      actions.appendChild(button('Close', 'btn quiet', closeSheet));
      root.appendChild(actions);
    });
  }

  function backupObject() {
    return {
      app: 'pocket-pet',
      v: 1,
      exportedAt: new Date().toISOString(),
      settings: save.settings,
      nextGen: save.nextGen,
      memorial: save.memorial,
      pet: save.pet
    };
  }
  function exportFile() {
    var json = JSON.stringify(backupObject(), null, 2);
    var blob = new Blob([json], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'pocket-pet.json';
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1200);
  }
  function copyBackup() {
    var json = JSON.stringify(backupObject(), null, 2);
    var done = function () { speak('Backup copied.', 1600); };
    var fail = function () { speak('Could not copy.', 1600); };
    if (window.host && typeof window.host.copy === 'function') {
      Promise.resolve(window.host.copy(json)).then(done).catch(fail);
      return;
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(json).then(done).catch(fail);
      return;
    }
    fail();
  }
  function importText(text) {
    var data;
    try { data = JSON.parse(text); } catch (e) {
      speak('That is not a backup.', 2000);
      return;
    }
    if (!data || (data.app && data.app !== 'pocket-pet') || !data.pet) {
      speak('That is not a Pocket Pet backup.', 2200);
      return;
    }
    save.settings = { sound: !data.settings || data.settings.sound !== false };
    save.memorial = Array.isArray(data.memorial) ? data.memorial.slice(-30) : [];
    save.pet = sanitizePet(data.pet);
    save.nextGen = clamp(num(data.nextGen, (save.pet.generation || 1) + (save.pet.phase === 'gone' ? 1 : 0)), 1, 9999);
    if (play) cancelPlay();
    persist();
    dockKey = '';
    closeSheet();
    speak('Backup restored.', 1800);
  }

  function openGoodbye() {
    var p = pet();
    if (!p || p.phase !== 'alive') return;
    openSheet(function (root) {
      root.appendChild(h2('Say goodbye'));
      root.appendChild(para(p.name + ' will go to the meadow. This cannot be undone.'));
      var stack = document.createElement('div');
      stack.className = 'stack';
      stack.appendChild(button('Stay', 'btn-primary', closeSheet));
      stack.appendChild(button('Say goodbye', 'btn quiet', function () {
        passOn('goodbye');
        closeSheet();
        tone(392, 0.16, 'sine', 0.03);
        tone(330, 0.18, 'sine', 0.025, 0.12);
        tone(262, 0.22, 'sine', 0.02, 0.24);
        dockKey = '';
      }));
      root.appendChild(stack);
    });
  }

  function openAway(report) {
    openSheet(function (root) {
      root.appendChild(h2('While you were away'));
      var sub = 'About ' + formatAway(report.minutes) + '.';
      if (report.capped) sub += ' A very long time passed. This is the last 36 hours.';
      root.appendChild(para(sub));
      var names = { fullness: 'Full', joy: 'Joy', rest: 'Rest', fresh: 'Fresh', health: 'Health' };
      Object.keys(names).forEach(function (k) {
        var a = Math.round(report.before[k]);
        var b = Math.round(report.after[k]);
        if (a !== b) root.appendChild(line(names[k], a + ' → ' + b));
      });
      if (report.before.stage !== report.after.stage) {
        root.appendChild(line('Grew', STAGE_NAME[report.after.stage] || ''));
      }
      if (report.after.poops > report.before.poops) root.appendChild(para('There is a mess to clean.'));
      if (!report.before.sick && report.after.sick) root.appendChild(para('They do not feel well.'));
      var stack = document.createElement('div');
      stack.className = 'stack';
      stack.style.marginTop = '16px';
      stack.appendChild(button("I'm here", 'btn-primary', closeSheet));
      root.appendChild(stack);
    });
  }

  function beginAgain() {
    save.pet = freshEgg();
    if (play) cancelPlay();
    persist();
    dockKey = '';
    speak('It is quiet. Warm it with your hands.', 10);
    sayUntil = 0;
  }

  petHit.addEventListener('click', function () {
    var p = pet();
    if (!p || play) return;
    if (p.phase === 'egg') warm();
    else if (p.phase === 'alive') nuzzle();
  });
  warmBtn.addEventListener('click', warm);
  feedBtn.addEventListener('click', openFood);
  playBtn.addEventListener('click', startPlay);
  washBtn.addEventListener('click', doWash);
  restBtn.addEventListener('click', toggleRest);
  medBtn.addEventListener('click', giveMedicine);
  againBtn.addEventListener('click', beginAgain);
  enoughBtn.addEventListener('click', endPlay);
  menuBtn.addEventListener('click', openMenu);
  scrim.addEventListener('click', function (e) { if (e.target === scrim) closeSheet(); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && scrim.classList.contains('open')) closeSheet();
  });
  document.addEventListener('pointerdown', unlock);
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) {
      if (play) endPlay();
      persist();
    }
  });
  window.addEventListener('pagehide', persist);

  function frame(now) {
    if (!lastFrame) lastFrame = now;
    var dt = Math.min(0.05, (now - lastFrame) / 1000);
    lastFrame = now;
    if (play) stepPlay(dt, now);
    if (!document.hidden) simulate(nowMs());
    if (now - lastPersist > 5000) {
      lastPersist = now;
      persist();
    }
    drawScene();
    syncPoops();
    syncChrome();
    requestAnimationFrame(frame);
  }

  load();
  var bootReport = simulate(nowMs());
  booting = false;
  persist();
  resizeCanvas();
  requestAnimationFrame(function () {
    requestAnimationFrame(frame);
  });
  if (meaningful(bootReport)) openAway(bootReport);

  window.__pocketPet = {
    save: function () { return save; },
    advance: function (hours) {
      var p = pet();
      if (!p) return null;
      p.lastTick = nowMs() - hours * 3600 * 1000;
      if (p.phase === 'alive' && p.born) {
        /* age uses born, so also shift born if we only want needs — leave born */
      }
      var r = simulate(nowMs());
      persist();
      dockKey = '';
      return r;
    }
  };
})();
</script>
</body>
</html>
