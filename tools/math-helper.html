<meta charset="utf-8">
<title>Graphing Calculator</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
/* Layout: graph sheet above a calculator panel on phones; panel docked left on wide screens */
:root{
  --bg:#e8eef0; --bg2:#eef3f4; --paper:#f8fbfb; --panel:#ffffff; --sel:#eef4f6;
  --ink:#14202a; --muted:#5b6b75; --line:#d2dde2;
  --grid-minor:#e6eef1; --grid-major:#cbd9df; --axis:#475864;
  --key:#f7f9fa; --key-fn:#e6edf0; --key-op:#dce6ea;
  --accent:#0b6e8a; --accent-ink:#ffffff; --danger:#b3261e;
  --c1:#d1495b; --c2:#2563c9; --c3:#d07d00; --c4:#7b3fbf; --c5:#11906a; --c6:#c13584;
  --font-ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-num:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d1317; --bg2:#10181d; --paper:#111a1f; --panel:#151e24; --sel:#1b272e;
    --ink:#e3ebee; --muted:#91a2ab; --line:#26333b;
    --grid-minor:#18232a; --grid-major:#23323b; --axis:#86a0ac;
    --key:#1c272e; --key-fn:#212e36; --key-op:#26353f;
    --accent:#4cb6d6; --accent-ink:#04222b; --danger:#ff8a80;
    --c1:#ff6b7d; --c2:#6ea8ff; --c3:#ffb347; --c4:#b48cff; --c5:#3ddc97; --c6:#ff7ac6;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1317; --bg2:#10181d; --paper:#111a1f; --panel:#151e24; --sel:#1b272e;
  --ink:#e3ebee; --muted:#91a2ab; --line:#26333b;
  --grid-minor:#18232a; --grid-major:#23323b; --axis:#86a0ac;
  --key:#1c272e; --key-fn:#212e36; --key-op:#26353f;
  --accent:#4cb6d6; --accent-ink:#04222b; --danger:#ff8a80;
  --c1:#ff6b7d; --c2:#6ea8ff; --c3:#ffb347; --c4:#b48cff; --c5:#3ddc97; --c6:#ff7ac6;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 var(--font-ui);overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font-family:inherit}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}

.app{height:100%;display:grid;grid-template-areas:"top" "plot" "exprs" "keys";grid-template-rows:auto minmax(160px,1fr) auto auto;gap:10px;
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.plot{position:relative;min-height:0;min-width:0;background:var(--paper);border:1px solid var(--line);border-radius:14px;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
.tools{position:absolute;top:8px;right:8px;display:flex;flex-direction:column;gap:6px}
.tool{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);
  font:500 20px/1 var(--font-ui);display:grid;place-items:center;cursor:pointer;padding:0}
.tool svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.readout{position:absolute;left:8px;bottom:8px;max-width:calc(100% - 16px);display:flex;align-items:center;gap:8px;
  padding:6px 10px;border-radius:9px;background:var(--panel);border:1px solid var(--line);
  font:12.5px/1.3 var(--font-num);font-variant-numeric:tabular-nums;color:var(--ink);pointer-events:none;white-space:nowrap;overflow:hidden}
.readout.hint{color:var(--muted);font-family:var(--font-ui)}
.readout .kind{color:var(--muted)}
.chip{width:10px;height:10px;border-radius:50%;flex:none;background:var(--chip,var(--ink))}

.top{grid-area:top;display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;min-height:34px}
.plot{grid-area:plot}
.exprs{grid-area:exprs}
.keycard{grid-area:keys;background:var(--bg2)}
.card{min-height:0;min-width:0;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.keycard.card{background:var(--bg2)}
.keyhead{display:flex;justify-content:flex-end;padding:6px 8px 0}
.app.nokeys .keyhead{padding:6px 8px}
.hidebtn{display:flex;align-items:center;gap:5px;border:0;background:transparent;color:var(--muted);font:600 13px/1 var(--font-ui);padding:6px 8px;border-radius:8px;cursor:pointer}
.hidebtn:hover{background:var(--sel)}
.hidebtn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s}
.app.nokeys .hidebtn svg{transform:rotate(180deg)}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;color:var(--muted);font:600 11px/1 var(--font-num);letter-spacing:.08em;padding:8px 9px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.ghost{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:8px;font:600 12px/1 var(--font-ui);padding:7px 10px;cursor:pointer}
.ghost[aria-pressed="true"]{background:var(--key-op)}

.list{overflow-y:auto;max-height:22vh;min-height:0;display:flex;flex-direction:column}
.app.nokeys .list{max-height:38vh}
.row{display:grid;grid-template-columns:28px minmax(0,1fr) 30px;column-gap:10px;row-gap:2px;align-items:center;padding:7px 6px 7px 12px;border-bottom:1px solid var(--line)}
.row.active,.row:focus-within{background:var(--sel)}
.sw{width:26px;height:26px;border-radius:7px;border:2px solid var(--c);background:var(--c);color:var(--paper);
  font:700 12px/1 var(--font-num);cursor:pointer;display:grid;place-items:center;padding:0}
.sw[aria-pressed="false"]{background:transparent;color:var(--c)}
.row input{width:100%;min-width:0;border:0;background:transparent;color:var(--ink);font:17px/1.3 var(--font-num);padding:5px 0;outline:none}
.row input::placeholder{color:var(--muted);font-size:15px}
.del{width:30px;height:30px;border:0;border-radius:8px;background:transparent;color:var(--muted);font-size:20px;line-height:1;cursor:pointer;padding:0}
.del:hover{background:var(--key-fn)}
.msg{grid-column:2 / 4;font:12.5px/1.3 var(--font-num);color:var(--muted);overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.msg.err{color:var(--danger);font-family:var(--font-ui)}
.add{border:0;background:transparent;color:var(--accent);font:600 14px/1 var(--font-ui);padding:12px 14px;text-align:left;cursor:pointer;flex:none}

.keys{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;padding:9px;border-top:1px solid var(--line);background:var(--bg2);margin-top:auto}
.k{height:38px;min-width:0;border:1px solid var(--line);border-radius:9px;background:var(--key);color:var(--ink);
  font:500 17px/1 var(--font-ui);cursor:pointer;box-shadow:0 1px 0 var(--line);padding:0;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.k.fn{background:var(--key-fn);font:500 14px/1 var(--font-num)}
.k.op{background:var(--key-op);font-size:19px}
.k.nav{background:transparent;color:var(--muted);box-shadow:none}
.k.abc{font:600 11px/1 var(--font-num);letter-spacing:.06em}
.k.var{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font:italic 600 19px/1 Georgia,"Times New Roman",serif}
.k.enter{background:var(--ink);border-color:var(--ink);color:var(--panel)}
.k:active{transform:translateY(1px);box-shadow:none}
.k.wide{grid-column:span 3;font:700 15px/1 var(--font-ui)}

@media (min-width:760px){
  .app{grid-template-columns:minmax(320px,370px) minmax(0,1fr);grid-template-areas:"top top" "exprs plot" "keys plot";grid-template-rows:auto minmax(0,1fr) auto}
  .list,.app.nokeys .list{max-height:none;flex:1}
  .k{height:44px}
}
@media (prefers-reduced-motion: reduce){.k:active{transform:none}}
.tools,.readout{z-index:2}
.ghost.icon{padding:5px 7px;display:grid;place-items:center}
.ghost.icon svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* Graph / Solve tabs */
.seg.tabs{flex:1 1 auto;min-width:0;max-width:360px}
.seg.tabs button{flex:1 1 auto;min-width:0;font:600 13px/1 var(--font-ui);letter-spacing:0;padding:8px 6px}
.app.kids .seg.tabs{border-radius:999px;border-width:2px}
.app.kids .seg.tabs button{font-weight:800;font-size:14px;padding:8px 6px}
.app.kids .seg.tabs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

/* Solve answer panel */
.solve-out{grid-area:plot;padding:14px 16px 18px;overflow-y:auto;gap:10px}
.sohead{display:flex;align-items:center;gap:10px}
.solabel{font:700 12px/1 var(--font-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.answer{display:flex;flex-direction:column;gap:6px}
.ans{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;font:700 26px/1.25 var(--font-num);color:var(--ink);overflow-wrap:anywhere;min-width:0}
.ans .approx{font:500 15px/1.3 var(--font-num);color:var(--muted)}
.answer .wait{font:500 16px/1.45 var(--font-ui);color:var(--muted);max-width:42ch}
.sonote{margin:0;font-size:14px;line-height:1.45;color:var(--muted);max-width:60ch}
.graphit{align-self:flex-start;border:0;border-radius:10px;background:var(--accent);color:var(--accent-ink);font:700 14px/1 var(--font-ui);padding:10px 14px;cursor:pointer}
.steps{list-style:none;counter-reset:st;margin:6px 0 0;padding:14px 0 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:14px}
.steps>li{counter-increment:st;position:relative;padding-left:36px;min-width:0}
.steps>li::before{content:counter(st);position:absolute;left:0;top:0;width:24px;height:24px;border-radius:50%;background:var(--sel);color:var(--muted);font:700 12px/24px var(--font-num);text-align:center}
.say{font:600 13.5px/1.4 var(--font-ui);color:var(--muted);margin-bottom:3px}
.math{font:500 17px/1.45 var(--font-num);color:var(--ink);overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.aside{font:14px/1.45 var(--font-num);color:var(--muted);overflow-wrap:anywhere}
.mark{display:inline-block;margin-top:3px;font:700 13px/1.3 var(--font-ui)}
.mark.ok{color:var(--c5)} .mark.bad{color:var(--danger)}
.substeps{list-style:none;margin:8px 0 0;padding:0 0 0 12px;border-left:2px solid var(--line);display:flex;flex-direction:column;gap:8px}
.app.kids .ans{color:var(--accent);font-size:30px}
.app.kids .steps>li::before{background:var(--key-fn);color:var(--key-dark)}
.app.kids .graphit{border-radius:999px;background:var(--hot);color:#fff}
.app.kids .math{font-weight:600;font-size:18px}
.sw.num{cursor:default}

/* Points screen */
.ptfoot{display:flex;align-items:center;gap:10px;padding-right:12px;border-top:1px solid var(--line);flex:none}
.ptfoot .switch{font-size:13px}
.app.kids .ptfoot .switch{font-size:14px}

/* Calc screen: column arithmetic */
.keys.five{grid-template-columns:repeat(5,minmax(0,1fr))}
.answer .approx{font:600 14px/1.4 var(--font-num);color:var(--muted)}
.colwrap{overflow-x:auto;margin-top:2px;padding:4px 0;border-top:1px solid var(--line)}
.cg{display:inline-grid;--cw:.8em;font:700 30px/1 var(--font-num);color:var(--ink);font-variant-numeric:tabular-nums;padding:10px 6px 6px}
.cg span{height:1.3em;display:flex;align-items:center;justify-content:center;position:relative}
.cg .sm{height:1.1em;font-size:15px;align-items:flex-end}
.cg .carry{color:var(--hot,var(--accent));font-weight:800}
.cg .op{color:var(--muted)}
.cg .muted{color:var(--muted);opacity:.6}
.cg .strike{text-decoration:line-through;text-decoration-color:var(--hot,var(--accent));text-decoration-thickness:3px;color:var(--muted)}
.cg .dp::after{content:".";position:absolute;right:-.16em;bottom:.12em}
.cg .bb{border-bottom:3px solid var(--ink)}
.cg .bt{border-top:3px solid var(--ink)}
.cg .bl{border-left:3px solid var(--ink)}
.cg .res,.cg .q{color:var(--accent)}
.cg .down{color:var(--hot,var(--accent))}
.cg .vline::before{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:2px solid var(--ink);transform:translateX(-1px)}
.cg .vhead::after{content:"";position:absolute;left:50%;bottom:1px;width:.22em;height:.22em;border-right:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:translateX(-50%) rotate(45deg)}
.cg .rem{justify-content:flex-start;white-space:nowrap;padding-left:.25em;color:var(--accent)}

/* Mode switch */
.switch{display:flex;align-items:center;gap:8px;font:700 13px/1 var(--font-ui);color:var(--ink);cursor:pointer;user-select:none;-webkit-user-select:none}
.track{width:48px;height:28px;border-radius:14px;border:0;padding:3px;background:var(--line);cursor:pointer;transition:background .2s;flex:none}
.track[aria-checked="true"]{background:var(--accent)}
.thumb{display:block;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.track[aria-checked="true"] .thumb{transform:translateX(20px)}

.switch{margin-left:auto}
.keys{border-top:0;margin-top:0;padding-top:4px;background:transparent}
.keys:not([hidden]){animation:keysUp .2s ease}
@keyframes keysUp{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}

/* Kids mode: friendly colors, rounded type, chunky keys */
html:root[data-mode="kids"]{
  --bg:#d9edff; --bg2:#eef7ff; --paper:#ffffff; --panel:#ffffff; --sel:#eef6ff;
  --ink:#1f2a4d; --muted:#56648f; --line:#cbdcf2;
  --grid-minor:#e9f1fd; --grid-major:#c4d7f2; --axis:#2b3a67;
  --key:#ffffff; --key-fn:#ffe07a; --key-op:#9be3c6; --key-dark:#1f2a4d; --key-shadow:#b6c9e6;
  --accent:#7c5cff; --accent-ink:#ffffff; --hot:#ff6b4a; --danger:#d63b2f;
  --c1:#ff4f6d; --c2:#3d7bff; --c3:#ff9f1c; --c4:#8b5cf6; --c5:#12b886; --c6:#e64980;
  --font-ui:ui-rounded,"SF Pro Rounded","Arial Rounded MT Bold","Nunito","Varela Round",-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-num:ui-rounded,"SF Pro Rounded","Arial Rounded MT Bold","Nunito",-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  html:root[data-mode="kids"]:not([data-theme="light"]){
    --bg:#121838; --bg2:#182050; --paper:#161e46; --panel:#1b2350; --sel:#232c60;
    --ink:#f1f3ff; --muted:#a8b0dd; --line:#2f3a75;
    --grid-minor:#1d2656; --grid-major:#2c3878; --axis:#b3c0ff;
    --key:#27306a; --key-fn:#f5c84c; --key-op:#5fd3a6; --key-dark:#151b3d; --key-shadow:#0d1230;
    --accent:#9b82ff; --accent-ink:#ffffff; --hot:#ff7a5c; --danger:#ff8a80;
    --c1:#ff6b84; --c2:#6f9dff; --c3:#ffb347; --c4:#b39bff; --c5:#3ddc97; --c6:#ff7ac6;
    color-scheme:dark;
  }
}
html:root[data-mode="kids"][data-theme="dark"]{
  --bg:#121838; --bg2:#182050; --paper:#161e46; --panel:#1b2350; --sel:#232c60;
  --ink:#f1f3ff; --muted:#a8b0dd; --line:#2f3a75;
  --grid-minor:#1d2656; --grid-major:#2c3878; --axis:#b3c0ff;
  --key:#27306a; --key-fn:#f5c84c; --key-op:#5fd3a6; --key-dark:#151b3d; --key-shadow:#0d1230;
  --accent:#9b82ff; --accent-ink:#ffffff; --hot:#ff7a5c; --danger:#ff8a80;
  --c1:#ff6b84; --c2:#6f9dff; --c3:#ffb347; --c4:#b39bff; --c5:#3ddc97; --c6:#ff7ac6;
  color-scheme:dark;
}
.app.kids #angle{display:none}
.app.kids .plot{border:2px solid var(--line);border-radius:22px}
.app.kids .card{border:2px solid var(--line);border-radius:22px}
.app.kids .switch{font-size:15px;font-weight:800}
.app.kids .hidebtn{font-weight:700}
.app.kids .tool{border-radius:50%;border:2px solid var(--line);font-weight:700}
.app.kids .readout{border-radius:999px;border:2px solid var(--line);font-size:14px;font-weight:700;padding:7px 14px}
.app.kids .readout.hint{font-weight:600;font-size:13px}
.app.kids .sw{border-radius:50%;width:28px;height:28px}
.app.kids .row input{font:600 20px/1.3 var(--font-num)}
.app.kids .add{color:var(--hot);font-weight:800}
.app.kids .keys{gap:8px;padding:4px 10px 12px}
.app.kids .k{height:44px;border:2px solid var(--line);border-radius:16px;font:700 21px/1 var(--font-ui);box-shadow:0 3px 0 var(--key-shadow)}
.app.kids .k.fn{color:var(--key-dark);border-color:transparent;font:700 17px/1 var(--font-num)}
.app.kids .k.op{color:var(--key-dark);border-color:transparent;font-size:24px}
.app.kids .k.nav{border-color:transparent;box-shadow:none;background:transparent}
.app.kids .k.abc{font:700 11px/1 var(--font-ui)}
.app.kids .k.var{font:italic 800 23px/1 Georgia,"Times New Roman",serif;border-color:transparent}
.app.kids .k.enter{background:var(--hot);border-color:transparent;color:#fff}
.app.kids .k:active{transform:translateY(3px);box-shadow:none}
.app.kids .k.wide{font:800 17px/1 var(--font-ui)}
@media (min-width:760px){.app.kids .k{height:54px}}
@media (prefers-reduced-motion: reduce){.track,.thumb,.hidebtn svg{transition:none}.keys:not([hidden]){animation:none}}
</style>

<div class="app" id="app">
  <header class="top">
    <div class="seg tabs" role="group" aria-label="Screen">
      <button type="button" id="tabGraph" aria-pressed="true">Graph</button>
      <button type="button" id="tabPoints" aria-pressed="false">Points</button>
      <button type="button" id="tabSolve" aria-pressed="false">Solve</button>
      <button type="button" id="tabCalc" aria-pressed="false">Calc</button>
    </div>
    <div class="seg" id="angle" role="group" aria-label="Angle unit">
      <button type="button" id="rad" aria-pressed="true">RAD</button>
      <button type="button" id="deg" aria-pressed="false">DEG</button>
    </div>
    <label class="switch" for="mode">Kids
      <button type="button" class="track" id="mode" role="switch" aria-checked="true"><span class="thumb"></span></button>
    </label>
  </header>

  <div class="plot" id="plot">
    <canvas id="cv" role="img" aria-label="Graph of your expressions"></canvas>
    <div class="tools">
      <button class="tool" id="zin" type="button" aria-label="Zoom in">+</button>
      <button class="tool" id="zout" type="button" aria-label="Zoom out">−</button>
      <button class="tool" id="home" type="button" aria-label="Reset view">
        <svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7"/><path d="M6 10v10h12V10"/></svg>
      </button>
    </div>
    <div class="readout hint" id="readout">Drag to pan · pinch to zoom · tap a curve to trace</div>
  </div>

  <section class="card solve-out" id="calcOut" aria-label="Answer and work" hidden>
    <div class="sohead">
      <span class="solabel">Answer</span>
      <label class="switch" for="work2">Show work
        <button type="button" class="track" id="work2" role="switch" aria-checked="true"><span class="thumb"></span></button>
      </label>
    </div>
    <div class="answer" id="calcAns"></div>
    <div class="colwrap" id="calcGrid" hidden></div>
    <ol class="steps" id="calcSteps" hidden></ol>
  </section>

  <section class="card solve-out" id="solveOut" aria-label="Answer" hidden>
    <div class="sohead">
      <span class="solabel">Answer</span>
      <label class="switch" for="work">Show work
        <button type="button" class="track" id="work" role="switch" aria-checked="true"><span class="thumb"></span></button>
      </label>
    </div>
    <div class="answer" id="answer"></div>
    <p class="sonote" id="sonote" hidden></p>
    <button type="button" class="graphit" id="graphIt" hidden>Graph this</button>
    <ol class="steps" id="steps" hidden></ol>
  </section>

  <section class="card exprs" aria-label="Expressions">
    <div class="list" id="list"></div>
    <div class="list" id="solveList" hidden></div>
    <div class="list" id="pointList" hidden></div>
    <div class="list" id="calcList" hidden></div>
    <div class="ptfoot" id="ptFoot" hidden>
      <button type="button" class="add" id="addPoint">+ Add point</button>
      <label class="switch" for="connect">Connect the dots
        <button type="button" class="track" id="connect" role="switch" aria-checked="false"><span class="thumb"></span></button>
      </label>

/* ---------- Calc screen (Kids): column arithmetic that shows its work ---------- */
const PLACE = ['ones','tens','hundreds','thousands','ten thousands','hundred thousands','millions','ten millions','hundred millions','billions','ten billions','hundred billions','trillions','ten trillions','hundred trillions'];
const DPLACE = ['tenths','hundredths','thousandths','ten-thousandths','hundred-thousandths','millionths','ten-millionths','hundred-millionths','billionths','ten-billionths','hundred-billionths','trillionths'];
const cap = s => s[0].toUpperCase() + s.slice(1);
const placeName = (k, D) => k < D ? (DPLACE[D - k - 1] || 'next decimal place') : (PLACE[k - D] || 'next place');
const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;
function grp(s){ // 12345.6 → 12,345.6
  s = String(s);
  const neg = s.startsWith('−') || s.startsWith('-'), body = neg ? s.slice(1) : s, [i, f] = body.split('.');
  return (neg ? '−' : '') + (i.length > 3 ? i.replace(/\B(?=(\d{3})+(?!\d))/g, ',') : i) + (f !== undefined ? '.' + f : '');
}
const fmtD = (str, D) => D ? str.slice(0, -D) + '.' + str.slice(-D) : str;
const trimDec = s => s.includes('.') ? s.replace(/0+$/, '').replace(/\.$/, '') : s;
function parseNum(str){

const C = (t, cls = '') => ({t, cls});
function digitCells(str, D, cls = '', muted = 0){

  if (D > 0 && str.length > D) out[str.length - D - 1].cls += ' dp';
  for (let m = 0; m < muted; m++) out[str.length - 1 - m].cls += ' muted';

}
function rowAt(n, cells, end, kind = ''){ // right-align cells so the last one lands in column `end`

  cells.forEach((c, idx) => { const col = end - (cells.length - 1 - idx); if (col >= 0 && col < n) r[col] = c; });

}

function cAdd(a, b){

  let carry = 0;
  for (let k = 0; k < n; k++) {
    const parts = [A, B].filter(x => k < x.length).map(x => +x[x.length - 1 - k]);
    const s = parts.reduce((p, q) => p + q, 0) + carry, last = k === n - 1;
    const expr = parts.join(' + ') + (carry ? ` + ${carry} carried` : '');
    if (s >= 10 && !last) carryAt[k + 1] = 1;

}

function cSub(a, b){
  const D = Math.max(a.f.length, b.f.length);
  const A = a.i + a.f.padEnd(D, '0'), B = b.i + b.f.padEnd(D, '0');
  const steps = [];
  if (D && a.f.length !== b.f.length) steps.push({math:`${a.s} → ${fmtD(A, D)}    ${b.s} → ${fmtD(B, D)}`});
  let top = A, bot = B, tMut = D - a.f.length, bMut = D - b.f.length, neg = false;

      cur[i] += 10; changed[i] = true;
      lines.push(`${cur[j] + 1} → ${cur[j]}` + '    0 → 9'.repeat(zeros) + `    ${was} → ${cur[i]}`);
    }
    const r = cur[i] - (y ?? 0);
    if (y !== null) lines.push(`${cur[i]} − ${y} = ${r}`);
    else if (!(r === 0 && k === n - 1 && n > D + 1)) lines.push(`${r}`);

  if (changed.some(Boolean)) { const r = new Array(N).fill(null); changed.forEach((c, i) => { if (c) r[i + 1] = C(String(cur[i]), 'carry'); }); r.kind = 'sm'; rows.push(r); }

function cMul(a, b){

  const dp = a.f.length + b.f.length, tS = T.i + T.f, uS = U.i + U.f, tD = digs(T), uD = digs(U);
  if (dp) steps.push({math:`${T.s} × ${U.s} → ${tD} × ${uD}`});

    const d = +uD[uD.length - 1 - j];
    if (d === 0 && uD.length > 1) { steps.push({math:`${tD} × ${'0'.padEnd(j + 1, '0')} = 0`}); continue; }

function cDiv(a, b){

    const lines = [`${s.q} × ${ds} = ${s.prod}`, `${s.cur} − ${s.prod} = ${s.r}`];

function calcRun(src){
  const s = src.replace(/[*xX]/g, '×').replace(/\//g, '÷').replace(/[-–]/g, '−').replace(/[\s,]+/g, '');
  if (!s) return {msg:'Type a problem like 345 ÷ 6 or 27 + 48.'};
  if (s.startsWith('−')) return {msg:'This calculator uses positive numbers. For negative numbers, use Solve.'};
  const ops = s.match(/[+−×÷]/g) || [];
  if (!ops.length) return {msg:/^\d*\.?\d*$/.test(s) ? 'Now pick +, −, ×, or ÷.' : 'Use numbers and + − × ÷ only.'};
  if (ops.length > 1) return {msg:'Do one step at a time, like 345 ÷ 6. For longer problems, use Solve.'};
  const [x, y] = s.split(/[+−×÷]/);
  if (!x) return {msg:'Type the first number before the sign.'};
  if (!y) return {msg:'Now type the second number.'};
  const a = parseNum(x), b = parseNum(y);
  if (!a || !b) return {msg:'Use numbers and + − × ÷ only.'};
  if ((a.i + a.f).length > 12 || (b.i + b.f).length > 12) return {msg:'Use numbers with 12 digits or fewer.'};

  return op === '+' ? cAdd(a, b) : op === '−' ? cSub(a, b) : op === '×' ? cMul(a, b) : cDiv(a, b);

/* ---------- Points screen ---------- */
const pointList = $('#pointList');
const letter = i => String.fromCharCode(65 + i);
function parseMark(src){
  let s = src.trim();

  s = s.replace(/^\(\s*/, '').replace(/\s*\)$/, '');
  const parts = s.includes(',') ? s.split(',') : s.split(/\s+/);
  if (parts.length !== 2 || parts.some(q => !q.trim())) throw new Error('Write a point like (3, 2)');
  return parts.map(q => {
    const r = compile(q);
    if (!r || r.hasX) throw new Error('Use numbers, like (3, 2)');
    const n = r.fn(0);
    if (!Number.isFinite(n)) throw new Error('That point has no value');
    return n;
  });
}

}

}

function addMark(src){ const m = mkMark(src); marks.push(m); buildPointRows(); save(); return m; }
function focusMark(m){ const el = document.getElementById('p-' + m.id); if (!el) return; el.focus(); const n = el.value.length; try { el.setSelectionRange(n, n); } catch (_) {} el.scrollIntoView({block:'nearest'}); }
let fitT;
function fitMarks(){ // bring off-screen points into view; never zooms in

  const pad = 36, seen = m => { const X = toSX(m.x), Y = toSY(m.y); return X > pad && X < W - pad && Y > pad && Y < H - pad; };
  if (v.every(seen)) return;

/* ---------- Graph ---------- */
