<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1f5f8b">
<title>WriteDesk</title>
<style>
:root{
  --accent:#1f5f8b; --accent2:#2b7bb4; --chrome:#f3f4f6; --chrome2:#ffffff; --line:#d9dce1; --ink:#1d2127; --muted:#6b7280;
  --desk:#e6e8eb; --btnh:#e4e8ee; --btnon:#cfe2f3; --sheet:#ffffff;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px); --safe-l:env(safe-area-inset-left,0px); --safe-r:env(safe-area-inset-right,0px);
}
@media (prefers-color-scheme:dark){
  :root{--chrome:#22262c; --chrome2:#2a2f36; --line:#3a4049; --ink:#e8eaed; --muted:#9aa3ad; --desk:#16191d; --btnh:#353b44; --btnon:#24435c; --sheet:#2a2f36;}
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--desk);color:var(--ink);font:14px/1.3 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
button,select,input{font:inherit;color:inherit}
#app{position:fixed;left:0;top:0;width:100%;height:var(--vh,100%);display:flex;flex-direction:column}

/* title bar */
#titlebar{background:var(--accent);color:#fff;display:flex;align-items:center;gap:6px;padding:calc(var(--safe-t) + 6px) calc(var(--safe-r) + 8px) 6px calc(var(--safe-l) + 8px);flex:none}
#titlebar .tb{background:transparent;border:0;color:#fff;min-width:38px;height:36px;border-radius:8px;display:grid;place-items:center;cursor:pointer;padding:0 8px}
#titlebar .tb:active,#titlebar .tb:hover{background:rgba(255,255,255,.16)}
#titlebar svg{width:20px;height:20px}
#docTitle{flex:1;min-width:0;background:transparent;border:1px solid transparent;color:#fff;font-weight:600;font-size:16px;padding:6px 8px;border-radius:7px;text-overflow:ellipsis}
#docTitle:focus{outline:none;background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.35)}
#saveState{font-size:12px;opacity:.85;white-space:nowrap}

/* tabs + ribbon */
#tabs{display:flex;gap:2px;background:var(--chrome);padding:4px calc(var(--safe-r) + 8px) 0 calc(var(--safe-l) + 8px);overflow-x:auto;flex:none;scrollbar-width:none}
#tabs::-webkit-scrollbar{display:none}
#tabs button{border:0;background:transparent;padding:8px 14px;border-radius:8px 8px 0 0;cursor:pointer;font-weight:500;color:var(--muted);white-space:nowrap}
#tabs button.on{background:var(--chrome2);color:var(--accent2);box-shadow:inset 0 -2px 0 var(--accent2)}
#ribbon{background:var(--chrome2);border-bottom:1px solid var(--line);flex:none;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
.panel{display:none;align-items:stretch;gap:4px;padding:6px calc(var(--safe-r) + 8px) 6px calc(var(--safe-l) + 8px);width:max-content;min-height:52px}
.panel.on{display:flex}
.grp{display:flex;align-items:center;gap:2px;padding:0 6px;border-right:1px solid var(--line)}
.grp:last-child{border-right:0}
.rb{border:0;background:transparent;min-width:36px;height:36px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;gap:5px;cursor:pointer;padding:0 7px;white-space:nowrap;position:relative;touch-action:manipulation}
.rb:hover{background:var(--btnh)}
.rb.on{background:var(--btnon)}
.rb:disabled{opacity:.35}
.rb svg{width:19px;height:19px;flex:none}
.rb .lbl{font-size:13px}
.rb.big{flex-direction:column;height:44px;gap:1px;font-size:11px;min-width:50px}
.rb.big svg{width:20px;height:20px}
.sel{height:34px;border:1px solid var(--line);border-radius:7px;background:var(--chrome2);padding:0 6px;max-width:150px}
.sel.narrow{width:64px}
.colorbtn .bar{position:absolute;left:8px;right:8px;bottom:4px;height:4px;border-radius:2px}
.colorbtn input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.stylebox{display:flex;gap:4px}
.stylebox button{border:1px solid var(--line);background:var(--chrome2);border-radius:7px;height:40px;min-width:74px;padding:0 10px;cursor:pointer;white-space:nowrap}
.stylebox button:hover{background:var(--btnh)}
.stylebox .s-title{font-size:17px;font-weight:300}
.stylebox .s-h1{font-size:15px;font-weight:700;color:#1f5f8b}
.stylebox .s-h2{font-size:14px;font-weight:700;color:#2b7bb4}
.stylebox .s-h3{font-size:13px;font-weight:700}
.stylebox .s-q{font-style:italic;color:var(--muted)}
.stylebox .s-code{font-family:Menlo,monospace;font-size:12px}

/* workspace */
#desk{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;position:relative;padding:24px 0 60px}
#zoomer{width:max-content;min-width:100%;display:flex;justify-content:center}
#page{
  --pw:816px; --ph:1056px; --mt:96px; --mr:96px; --mb:96px; --ml:96px;
  width:var(--pw);min-height:var(--ph);background:#fff;color:#111;
  box-shadow:0 1px 3px rgba(0,0,0,.15),0 6px 22px rgba(0,0,0,.08);
  padding:var(--mt) var(--mr) var(--mb) var(--ml);
  outline:none;font-family:Calibri,"Helvetica Neue",Arial,sans-serif;font-size:12pt;line-height:1.15;
  word-wrap:break-word;overflow-wrap:break-word;caret-color:#1f5f8b;
  background-image:repeating-linear-gradient(to bottom,transparent 0,transparent calc(var(--ph) - 1px),#9aa6b2 calc(var(--ph) - 1px),#9aa6b2 var(--ph));
  -webkit-user-select:text;user-select:text;
}
#page.dark{background-color:#1e2227;color:#e6e6e6}
#page.web{width:min(100%,900px);min-height:100%;background-image:none;box-shadow:none;padding:20px calc(var(--safe-r) + 18px) 45vh calc(var(--safe-l) + 18px);border-radius:0;font-size:max(12pt,16px)}
#desk:has(#page.web){padding:0;background:#fff}
#desk:has(#page.web.dark){background:#1e2227}
#page.web ~ *, #zoomer:has(#page.web){width:100%}
#page p{margin:0 0 8pt}
#page h1,#page h2,#page h3,#page h4{margin:12pt 0 6pt;line-height:1.2}
#page h1{font-size:20pt;color:#1f4e79;font-weight:700}
#page h2{font-size:16pt;color:#2e74b5;font-weight:700}
#page h3{font-size:13pt;color:#1f4e79;font-weight:700}
#page h4{font-size:12pt;font-weight:700;font-style:italic}
#page h1.title{font-size:28pt;font-weight:300;color:#111;margin:0 0 10pt;letter-spacing:-.3px}
#page.dark h1.title{color:#fff}
#page.dark h1,#page.dark h2,#page.dark h3{color:#8cc4f0}
#page blockquote{margin:8pt 36pt;font-style:italic;color:#444;border-left:3px solid #c8d3de;padding-left:12px}
#page.dark blockquote{color:#bbb}
#page pre{font-family:Menlo,"Courier New",monospace;font-size:10pt;background:#f4f5f7;padding:8px 10px;border-radius:4px;white-space:pre-wrap;margin:0 0 8pt}
#page.dark pre{background:#2b3036}
#page ul,#page ol{margin:0 0 8pt;padding-left:28pt}
#page li{margin:0 0 2pt}
#page a{color:#0563c1;text-decoration:underline}
#page table{border-collapse:collapse;width:100%;margin:0 0 8pt;table-layout:fixed}
#page td,#page th{border:1px solid #9aa3ad;padding:4px 6px;vertical-align:top;min-width:30px}
#page th{background:#eef2f6;font-weight:700;text-align:left}
#page.dark th{background:#2d3340}
#page td p,#page th p{margin:0}
#page img{max-width:100%;height:auto;vertical-align:bottom}
#page img.picked{outline:3px solid #2b7bb4;outline-offset:2px}
#page hr{border:0;border-top:1px solid #999;margin:10pt 0}
#page .pb{display:block;height:0;border-top:2px dashed #9aa6b2;margin:16pt 0;position:relative;-webkit-user-select:none;user-select:none}
#page .pb::after{content:"Page break";position:absolute;left:50%;top:-9px;transform:translateX(-50%);background:#fff;color:#7a8794;font:11px -apple-system,sans-serif;padding:0 8px}
#page.dark .pb::after{background:#1e2227}
#page .found{background:#ffe066;color:#000}
#page:empty::before{content:"Start typing…";color:#aaa}

/* status bar */
#status{flex:none;display:flex;align-items:center;gap:14px;background:var(--chrome);border-top:1px solid var(--line);padding:5px calc(var(--safe-r) + 10px) calc(var(--safe-b) + 5px) calc(var(--safe-l) + 10px);font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden}
#status .sp{flex:1}
#zoomSel{height:26px;font-size:12px;border:1px solid var(--line);border-radius:6px;background:var(--chrome2);padding:0 4px}
#status button{border:0;background:transparent;color:var(--muted);cursor:pointer;height:26px;border-radius:6px;padding:0 6px}

/* focus / fullscreen */
#app.focus #titlebar,#app.focus #tabs,#app.focus #ribbon,#app.focus #status{display:none}
#app.focus #desk{padding-top:calc(var(--safe-t) + 16px)}
#exitFocus{display:none;position:fixed;right:calc(var(--safe-r) + 12px);top:calc(var(--safe-t) + 10px);z-index:40;border:0;border-radius:20px;background:rgba(31,95,139,.88);color:#fff;padding:8px 14px;font-weight:600;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.25);opacity:.55;transition:opacity .2s}
#exitFocus:hover,#exitFocus:active{opacity:1}
#app.focus ~ #exitFocus{display:block}

/* floating context bars */
.ctx{position:fixed;z-index:30;display:none;gap:2px;background:var(--chrome2);border:1px solid var(--line);border-radius:10px;padding:4px;box-shadow:0 6px 22px rgba(0,0,0,.18);max-width:calc(100vw - 16px);overflow-x:auto}
.ctx.on{display:flex}
.ctx .rb{height:32px;min-width:32px;font-size:12px}

/* sheets & dialogs */
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:50;display:none}
#scrim.on{display:block}
.sheet{position:fixed;z-index:60;background:var(--sheet);color:var(--ink);border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.3);display:none;flex-direction:column;max-height:calc(var(--vh,100vh) - 40px);left:50%;top:50%;transform:translate(-50%,-50%);width:min(520px,calc(100vw - 24px))}
.sheet.on{display:flex}
.sheet header{display:flex;align-items:center;gap:8px;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.sheet header h2{margin:0;font-size:17px;flex:1}
.sheet .body{padding:14px 16px 16px;overflow:auto}
.x{border:0;background:var(--btnh);width:30px;height:30px;border-radius:15px;cursor:pointer;font-size:15px}
.btn{border:1px solid var(--line);background:var(--chrome2);border-radius:9px;padding:9px 14px;cursor:pointer;font-weight:500}
.btn:hover{background:var(--btnh)}
.btn.pri{background:var(--accent2);border-color:var(--accent2);color:#fff}
.btn.danger{color:#c0392b}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.field{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 11px;background:var(--chrome2)}
label.lab{display:block;font-size:12px;color:var(--muted);margin:0 0 4px}
.docs{display:flex;flex-direction:column;gap:6px}
.doc{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:10px;cursor:pointer}
.doc:hover{background:var(--btnh)}
.doc.cur{border-color:var(--accent2)}
.doc .ic{width:34px;height:42px;border:1px solid var(--line);border-radius:3px;background:#fff;flex:none;position:relative}
.doc .ic::before{content:"";position:absolute;left:6px;right:6px;top:8px;height:22px;background:repeating-linear-gradient(#c4ccd5 0 2px,transparent 2px 6px)}
.doc .meta{flex:1;min-width:0}
.doc .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.doc .dt{font-size:12px;color:var(--muted)}
.doc .acts{display:flex;gap:2px}
.doc .acts button{border:0;background:transparent;width:32px;height:32px;border-radius:8px;cursor:pointer;color:var(--muted)}
.doc .acts button:hover{background:var(--chrome)}
.tpls{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin-bottom:16px}
.tpl{border:1px solid var(--line);border-radius:10px;padding:10px;cursor:pointer;text-align:center;background:var(--chrome2)}
.tpl:hover{background:var(--btnh)}
.tpl .pv{height:70px;background:#fff;border:1px solid #ddd;border-radius:3px;margin-bottom:6px;padding:8px;display:flex;flex-direction:column;gap:4px}
.tpl .pv i{display:block;height:3px;background:#c9d0d8;border-radius:2px}
.tpl .pv i.h{height:6px;background:#2e74b5;width:60%}
.sectitle{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin:4px 0 8px}
#grid{display:grid;grid-template-columns:repeat(8,22px);gap:3px;justify-content:center;margin:8px 0}
#grid div{width:22px;height:22px;border:1px solid var(--line);border-radius:3px;background:var(--chrome2)}
#grid div.on{background:var(--btnon);border-color:var(--accent2)}
#gridLbl{text-align:center;color:var(--muted);margin-bottom:8px}
.symgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:4px}
.symgrid button{height:40px;border:1px solid var(--line);border-radius:8px;background:var(--chrome2);font-size:18px;cursor:pointer}
.symgrid button:hover{background:var(--btnh)}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.opt{border:1px solid var(--line);border-radius:10px;padding:10px;cursor:pointer;background:var(--chrome2);text-align:left}
.opt.on{border-color:var(--accent2);background:var(--btnon)}
.opt b{display:block;margin-bottom:2px}
.opt small{color:var(--muted)}

/* find bar */
#findbar{display:none;flex:none;gap:6px;align-items:center;background:var(--chrome2);border-bottom:1px solid var(--line);padding:6px calc(var(--safe-r) + 8px) 6px calc(var(--safe-l) + 8px);flex-wrap:wrap}
#findbar.on{display:flex}
#findbar input[type=text]{flex:1;min-width:120px;border:1px solid var(--line);border-radius:8px;padding:7px 9px;background:var(--chrome)}
#findCount{font-size:12px;color:var(--muted);min-width:56px;text-align:center}
#findbar label{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:4px}

html.kb #status{display:none}
html.kb #desk{padding-bottom:0}
/* keyboard + mouse */
:focus{outline:none}
:focus-visible{outline:2px solid var(--accent2);outline-offset:1px}
#page:focus-visible{outline:none}
#page{cursor:text}
#page img,#page a,#page input{cursor:pointer}
.rb,.stylebox button,.tb,#tabs button{cursor:pointer}
#cmenu{position:fixed;z-index:80;display:none;flex-direction:column;min-width:210px;background:var(--chrome2);border:1px solid var(--line);border-radius:10px;padding:5px;box-shadow:0 10px 30px rgba(0,0,0,.22)}
#cmenu.on{display:flex}
#cmenu button{display:flex;justify-content:space-between;gap:20px;border:0;background:transparent;text-align:left;padding:7px 10px;border-radius:6px;cursor:pointer}
#cmenu button:hover,#cmenu button:focus-visible{background:var(--accent2);color:#fff;outline:none}
#cmenu button:hover kbd,#cmenu button:focus-visible kbd{color:#fff}
#cmenu kbd{font:12px -apple-system,sans-serif;color:var(--muted)}
#cmenu hr{border:0;border-top:1px solid var(--line);margin:4px 2px}
#toast{position:fixed;left:50%;bottom:calc(var(--safe-b) + 46px);transform:translateX(-50%) translateY(20px);background:#222;color:#fff;padding:9px 16px;border-radius:20px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:90;max-width:90vw;text-align:center}
#toast.on{opacity:.95;transform:translateX(-50%)}
#fileIn,#imgIn{display:none}

@media (max-width:600px){
  #saveState{display:none}
  #desk{padding:12px 0 60px}
  .rb .lbl.opt-hide{display:none}
  .sheet{top:auto;bottom:0;left:0;transform:none;width:100%;border-radius:16px 16px 0 0;padding-bottom:var(--safe-b);max-height:calc(var(--vh,100vh) - 30px)}
}
@media print{
  #titlebar,#tabs,#ribbon,#status,#findbar,.ctx,#exitFocus,#toast{display:none!important}
  #app{position:static;height:auto}
  #desk{overflow:visible;padding:0}
  #page{box-shadow:none;background-image:none;zoom:1!important}
  #page .pb{border:0;margin:0;break-after:page}
  #page .pb::after{display:none}
}
</style>
</head>
<body>
<div id="app">
  <div id="titlebar">
    <button class="tb" id="bDocs" title="Documents" aria-label="Documents"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></button>
    <button class="tb" id="bUndo" title="Undo (⌘Z)" aria-label="Undo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg></button>
    <button class="tb" id="bRedo" title="Redo (⇧⌘Z)" aria-label="Redo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 14 5-5-5-5"/><path d="M20 9H9a5 5 0 0 0 0 10h3"/></svg></button>
    <input id="docTitle" value="Untitled document" aria-label="Document title" autocomplete="off" spellcheck="false">
    <span id="saveState">Saved</span>
    <button class="tb" id="bFind" title="Find & Replace (⌘F)" aria-label="Find"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg></button>
    <button class="tb" id="bFull" title="Full screen" aria-label="Full screen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  </div>
  <div id="tabs" role="tablist">
    <button data-tab="file">File</button>
    <button data-tab="home" class="on">Home</button>
    <button data-tab="insert">Insert</button>
    <button data-tab="layout">Layout</button>
    <button data-tab="view">View</button>
  </div>
  <div id="ribbon">
    <!-- FILE -->
    <div class="panel" data-panel="file">
      <div class="grp">
        <button class="rb big" data-act="new"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M12 11v6M9 14h6"/></svg>New</button>
        <button class="rb big" data-act="docs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>Documents</button>
        <button class="rb big" data-act="open"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3M7 8l5-5 5 5"/><path d="M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></svg>Open file</button>
        <button class="rb big" data-act="dup"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="8" y="8" width="12" height="13" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h2"/></svg>Duplicate</button>
      </div>
      <div class="grp">
        <button class="rb big" data-act="exp-docx"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>Word .docx</button>
        <button class="rb big" data-act="exp-html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m8 8-4 4 4 4M16 8l4 4-4 4M14 5l-4 14"/></svg>Web page</button>
        <button class="rb big" data-act="exp-txt"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 6h14M5 10h14M5 14h10M5 18h7"/></svg>Plain text</button>
        <button class="rb big" data-act="print"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M7 9V3h10v6"/><rect x="3" y="9" width="18" height="8" rx="2"/><path d="M7 14h10v7H7z"/></svg>Print / PDF</button>
      </div>
    </div>
    <!-- HOME -->
    <div class="panel on" data-panel="home">
      <div class="grp">
        <select class="sel" id="fontSel" title="Font" aria-label="Font"></select>
        <select class="sel narrow" id="sizeSel" title="Font size" aria-label="Font size"></select>
      </div>
      <div class="grp">

<script>
'use strict';
/* ===================================================================
   WriteDesk — a full-screen word processor in one HTML file.
   Offline. Documents live in this file's own storage (IndexedDB).
   Opens and saves real Word .docx files (built-in zip, no libraries).
   =================================================================== */
const $ = id => document.getElementById(id);
const page = $('page'), desk = $('desk'), app = $('app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const xesc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, '');
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
let toastT;
function toast(msg, ms = 2200) { const t = $('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), ms); }

/* ---------- viewport (keeps ribbon visible above the iOS keyboard) ---------- */
let tallest = 0, lastOrient = '';
function fitViewport() {
  const vv = window.visualViewport;
  const h = vv ? vv.height : window.innerHeight;
  const orient = innerWidth > innerHeight ? 'l' : 'p'; if (orient !== lastOrient) { lastOrient = orient; tallest = 0; }
  tallest = Math.max(tallest, h, window.innerHeight);
  const editing = document.activeElement && (document.activeElement.isContentEditable || /^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName));
  const kb = editing && h < tallest - 120;
  document.documentElement.classList.toggle('kb', kb);
  document.documentElement.style.setProperty('--vh', h + 'px');
  if (vv && (window.scrollY || vv.offsetTop)) window.scrollTo(0, 0);
  if (kb) setTimeout(caretIntoView, 60);
}
function caretIntoView() {
  const s = getSelection(); if (!s.rangeCount || !page.contains(s.anchorNode)) return;
  const r = s.getRangeAt(0); let rect = r.getClientRects()[0];
  if (!rect) { const el = s.anchorNode.nodeType === 1 ? s.anchorNode : s.anchorNode.parentElement; rect = el && el.getBoundingClientRect(); }
  if (!rect) return; const d = desk.getBoundingClientRect();
  if (rect.bottom > d.bottom - 24) desk.scrollTop += rect.bottom - d.bottom + 48;
  else if (rect.top < d.top + 8) desk.scrollTop -= d.top - rect.top + 48;
}

if (window.visualViewport) { visualViewport.addEventListener('resize', fitViewport); visualViewport.addEventListener('scroll', fitViewport); }

fitViewport();

/* ---------- storage (IndexedDB, falls back to memory) ---------- */
const DB = (() => {
  let dbp = null; const mem = new Map();
  function open() {
    if (dbp) return dbp;
    dbp = new Promise((res) => {
      try {
        const r = indexedDB.open('writedesk', 1);
        r.onupgradeneeded = () => r.result.createObjectStore('docs', { keyPath: 'id' });
        r.onsuccess = () => res(r.result);
        r.onerror = () => res(null);
      } catch (e) { res(null); }
    });
    return dbp;
  }
  async function tx(mode, fn) {
    const db = await open();
    if (!db) return fn(null);
    return new Promise((res, rej) => {
      const t = db.transaction('docs', mode); const s = t.objectStore('docs');
      const out = fn(s); t.oncomplete = () => res(out && out.result !== undefined ? out.result : out); t.onerror = () => rej(t.error);
    });
  }
  return {
    async all() { const db = await open(); if (!db) return [...mem.values()];
      return new Promise((res) => { const r = db.transaction('docs').objectStore('docs').getAll(); r.onsuccess = () => res(r.result || []); r.onerror = () => res([]); }); },
    async get(id) { const db = await open(); if (!db) return mem.get(id);
      return new Promise((res) => { const r = db.transaction('docs').objectStore('docs').get(id); r.onsuccess = () => res(r.result); r.onerror = () => res(null); }); },
    put(doc) { return tx('readwrite', s => s ? s.put(doc) : mem.set(doc.id, doc)); },
    del(id) { return tx('readwrite', s => s ? s.delete(id) : mem.delete(id)); },
  };
})();
const LS = { get(k, d) { try { const v = localStorage.getItem('wd.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
             set(k, v) { try { localStorage.setItem('wd.' + k, JSON.stringify(v)); } catch (e) {} } };

/* ---------- state ---------- */
const PAGE_SIZES = { letter: { w: 8.5, h: 11, name: 'Letter', sub: '8.5 × 11 in' }, legal: { w: 8.5, h: 14, name: 'Legal', sub: '8.5 × 14 in' }, a4: { w: 8.27, h: 11.69, name: 'A4', sub: '21 × 29.7 cm' }, a5: { w: 5.83, h: 8.27, name: 'A5', sub: '14.8 × 21 cm' } };
const MARGINS = { normal: { name: 'Normal', m: [1, 1, 1, 1] }, narrow: { name: 'Narrow', m: [.5, .5, .5, .5] }, moderate: { name: 'Moderate', m: [1, .75, 1, .75] }, wide: { name: 'Wide', m: [1, 2, 1, 2] } };
const state = { doc: null, zoom: LS.get('zoom', 'fit'), view: LS.get('view2', innerWidth < 700 ? 'web' : 'print'), dark: LS.get('dark', false), dirty: false };
const DPI = 96;

function blankDoc(title = 'Untitled document', html = '<p><br></p>') {
  return { id: uid(), title, html, created: Date.now(), updated: Date.now(), size: LS.get('defSize', 'letter'), orient: 'portrait', margins: 'normal' };

    if (c.nodeType !== 1) continue;
    if (c.localName === 'p') await paraHTML(c, false);
    else if (c.localName === 'tbl') { closeLists(); html.push(await tableHTML(c)); }
    else if (c.localName === 'sdt') { const sc = kid(c, 'sdtContent'); if (sc) for (const p of sc.childNodes) if (p.nodeType === 1 && p.localName === 'p') await paraHTML(p, false); }
  }
  closeLists();
  // page setup
  const setup = {}; const sp = kid(body, 'sectPr');
  if (sp) { const sz = kid(sp, 'pgSz'); if (sz) { const w = +attr(sz, 'w') / 1440, h = +attr(sz, 'h') / 1440; const land = attr(sz, 'orient') === 'landscape' || w > h; const [pw, ph] = land ? [h, w] : [w, h]; setup.orient = land ? 'landscape' : 'portrait';
      setup.size = Object.entries(PAGE_SIZES).reduce((best, [k, v]) => Math.abs(v.w - pw) + Math.abs(v.h - ph) < best[1] ? [k, Math.abs(v.w - pw) + Math.abs(v.h - ph)] : best, ['letter', 9])[0]; }
    const mg = kid(sp, 'pgMar'); if (mg) { const l = +attr(mg, 'left') / 1440, t = +attr(mg, 'top') / 1440; setup.margins = l <= .6 ? 'narrow' : l >= 1.8 ? 'wide' : Math.abs(l - .75) < .1 ? 'moderate' : 'normal'; } }
  return { html: html.join('') || '<p><br></p>', setup };
}
function kids(el, name) { return el ? [...el.childNodes].filter(n => n.nodeType === 1 && n.localName === name) : []; }
function kid(el, name) { return kids(el, name)[0] || null; }
function attr(el, name) { if (!el) return null; return el.getAttributeNS('http://schemas.openxmlformats.org/wordprocessingml/2006/main', name) || el.getAttribute('w:' + name) || el.getAttribute(name); }

/* ---------- open files ---------- */
$('fileIn').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    await saveNow(); const name = f.name.replace(/\.[^.]+$/, ''); let html, setup = {};
    if (/\.docx$/i.test(f.name)) { toast('Opening…'); ({ html, setup } = await importDocx(await f.arrayBuffer())); }
    else if (/\.html?$/i.test(f.name)) { const d = new DOMParser().parseFromString(await f.text(), 'text/html'); const ed = d.querySelector('#page,[data-writedesk]'); html = sanitize((ed || d.body).innerHTML); }
    else if (/\.(md|markdown)$/i.test(f.name)) html = mdToHTML(await f.text());
    else html = (await f.text()).split(/\r?\n/).map(l => `<p>${esc(l) || '<br>'}</p>`).join('');
    const d = blankDoc(name, html); Object.assign(d, setup); await DB.put(d); await loadDoc(d); closeSheets(); toast('Opened ' + f.name);
  } catch (err) { toast('Could not open ' + f.name + ': ' + (err && err.message || err), 4500); }
});
function mdToHTML(md) {
  const inl = s => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>').replace(/(^|[^*])\*([^*]+)\*/g, '$1<i>$2</i>').replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2">$1</a>');
  const out = []; let list = null; const lines = md.split(/\r?\n/); let inCode = false, code = [];
  const endList = () => { if (list) { out.push(`</${list}>`); list = null; } };
  for (const l of lines) {
    if (/^```/.test(l)) { if (inCode) { out.push(`<pre>${esc(code.join('\n'))}</pre>`); code = []; inCode = false; } else { endList(); inCode = true; } continue; }
    if (inCode) { code.push(l); continue; }
    let m;
    if ((m = l.match(/^(#{1,4})\s+(.*)/))) { endList(); out.push(`<h${m[1].length}>${inl(m[2])}</h${m[1].length}>`); }
    else if ((m = l.match(/^\s*[-*+]\s+(.*)/))) { if (list !== 'ul') { endList(); out.push('<ul>'); list = 'ul'; } out.push(`<li>${inl(m[1])}</li>`); }
    else if ((m = l.match(/^\s*\d+[.)]\s+(.*)/))) { if (list !== 'ol') { endList(); out.push('<ol>'); list = 'ol'; } out.push(`<li>${inl(m[1])}</li>`); }
    else if ((m = l.match(/^>\s?(.*)/))) { endList(); out.push(`<blockquote>${inl(m[1])}</blockquote>`); }
    else if (/^\s*(---|\*\*\*)\s*$/.test(l)) { endList(); out.push('<hr>'); }
    else if (l.trim()) { endList(); out.push(`<p>${inl(l)}</p>`); } else endList();
  }
  endList(); if (inCode) out.push(`<pre>${esc(code.join('\n'))}</pre>`); return out.join('') || '<p><br></p>';
}

/* ---------- export ---------- */
function fileName(ext) { return (state.doc.title || 'Document').replace(/[\\/:*?"<>|]+/g, '-').trim().slice(0, 80) + '.' + ext; }
function download(blob, name) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 30000);
}
async function exportDocx() { try { await saveNow(); pick(null); const b = await buildDocx(); download(b, fileName('docx')); toast('Exported ' + fileName('docx')); } catch (e) { toast('Export failed: ' + (e && e.message || e), 4500); console.error(e); } }
function exportHTML() {
  saveNow(); pick(null); const d = pageDims(); const css = [...document.styleSheets[0].cssRules].filter(r => r.selectorText && r.selectorText.includes('#page')).map(r => r.cssText).join('\n');
  const html = `<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>${esc(state.doc.title)}</title><style>body{margin:0;background:#e6e8eb}${css}\n#page{margin:24px auto;--pw:${d.w}in;--ph:${d.h}in;--mt:${d.m[0]}in;--mr:${d.m[1]}in;--mb:${d.m[2]}in;--ml:${d.m[3]}in;background-image:none;max-width:100%}@media(max-width:700px){#page{padding:24px 18px;width:auto;margin:0;min-height:100vh}}@media print{body{background:#fff}#page{margin:0;box-shadow:none;padding:0;width:auto}#page .pb{border:0;break-after:page}#page .pb::after{display:none}}</style></head><body><div id="page" data-writedesk>${cleanHTML(page.innerHTML).replace(/ contenteditable="false"/g, '')}</div></body></html>`;
  download(new Blob([html], { type: 'text/html' }), fileName('html')); toast('Exported ' + fileName('html'));
}
function exportTxt() { saveNow(); download(new Blob([page.innerText.replace(/  /g, '\t')], { type: 'text/plain' }), fileName('txt')); toast('Exported ' + fileName('txt')); }

/* ---------- start ---------- */
(async function start() {
  syncView();
  const tab = LS.get('tab', 'home'); const tb = document.querySelector(`#tabs [data-tab="${tab}"]`); if (tb && tab !== 'file') tb.click();
  let d = null; const last = LS.get('last', null);
  if (last) d = await DB.get(last);
  if (!d) { const all = (await DB.all()).sort((a, b) => b.updated - a.updated); d = all[0]; }
  if (!d) { d = blankDoc('Welcome', `<h1 class="title">Welcome to WriteDesk</h1><p>A full word processor that works offline. Everything saves automatically on this device.</p><h2>Tips</h2><ul><li>Tap <b>Documents</b> (folder, top left) for your files and templates.</li><li><b>File → Word .docx</b> saves a file Word, Pages and Google Docs can open.</li><li><b>File → Open file</b> opens .docx, .html, .txt and Markdown.</li><li>Tap <b>⤢</b> for full screen. Tap <b>Exit full screen</b> to bring the tools back.</li><li>With a keyboard: ⌘B, ⌘I, ⌘U, ⌘Z, ⌘F find, ⌘K link, ⌘S save, ⌘Return page break, Tab moves through table cells.</li></ul><p>Select this text and start typing to replace it.</p>`); await DB.put(d); }
  await loadDoc(d); updUndo();
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
})();
